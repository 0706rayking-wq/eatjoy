        </div>
        </div>
      </div>
     );
    };

    const DEFAULT_PROMOTION_LEVELS = [
      {
       title: '正職',
       items: ['全區站通關', '盤點物料', '廚房守則']
      },
      {
       title: '副領班',
       items: ['食材不浪費', '叫貨確實不斷貨', '崗位安排得宜', '出餐品質管理', '食安把關', '職安把關', '營運管理', '崗位工作流程']
      },
      {
       title: '領班',
       items: ['每月班表', '環境整潔', '表格管理', '文件管理', '檢驗報告', '食材耗損', '面試']
      },
      {
       title: '副主廚 / 副領班',
       items: ['幹部培訓', '人力招募', '菜單更換', '成本控制（人力、食材）', '食材知識', '危機處理']
      },
      {
       title: '主廚',
       items: []
      }
     ];

    const PromotionPathPage = ({ onBack, isSuperAdmin = false, getPublicPath, triggerNotify }) => {
     const [levels, setLevels] = useState(DEFAULT_PROMOTION_LEVELS);
     const [draftLevels, setDraftLevels] = useState(DEFAULT_PROMOTION_LEVELS);
     const [isEditing, setIsEditing] = useState(false);
     const [saving, setSaving] = useState(false);
     const [loadedAt, setLoadedAt] = useState(null);

     useEffect(() => {
      if (!getPublicPath) return;
      const ref = db.doc(getPublicPath('business/promotion_path'));
      const unsub = ref.onSnapshot(doc => {
       const data = doc.exists ? doc.data() : {};
       const nextLevels = Array.isArray(data.levels) && data.levels.length > 0
        ? data.levels.map(level => ({ title: level.title || '', items: Array.isArray(level.items) ? level.items : [] }))
        : DEFAULT_PROMOTION_LEVELS;
       setLevels(nextLevels);
       if (!isEditing) setDraftLevels(nextLevels);
       setLoadedAt(data.updatedAt || null);
      }, () => {
       triggerNotify?.("升遷管道讀取失敗，已顯示預設內容", "warning");
      });
      return () => unsub();
     }, [getPublicPath, isEditing]);

     const activeLevels = isEditing ? draftLevels : levels;

     const updateLevelTitle = (idx, title) => {
      setDraftLevels(prev => prev.map((level, i) => i === idx ? { ...level, title } : level));
     };
     const updateItem = (levelIdx, itemIdx, value) => {
      setDraftLevels(prev => prev.map((level, i) => {
       if (i !== levelIdx) return level;
       return { ...level, items: level.items.map((item, j) => j === itemIdx ? value : item) };
      }));
     };
     const addLevel = () => {
      setDraftLevels(prev => [...prev, { title: '新職務', items: [''] }]);
     };
     const removeLevel = (idx) => {
      if (!window.confirm("確定要刪除此職務階段嗎？")) return;
      setDraftLevels(prev => prev.filter((_, i) => i !== idx));
     };
     const moveLevel = (idx, delta) => {
      setDraftLevels(prev => {
       const nextIdx = idx + delta;
       if (nextIdx < 0 || nextIdx >= prev.length) return prev;
       const next = [...prev];
       const [item] = next.splice(idx, 1);
       next.splice(nextIdx, 0, item);
       return next;
      });
     };
     const addItem = (levelIdx) => {
      setDraftLevels(prev => prev.map((level, i) => i === levelIdx ? { ...level, items: [...level.items, ''] } : level));
     };
     const removeItem = (levelIdx, itemIdx) => {
      setDraftLevels(prev => prev.map((level, i) => {
       if (i !== levelIdx) return level;
       return { ...level, items: level.items.filter((_, j) => j !== itemIdx) };
      }));
     };
     const cancelEdit = () => {
      setDraftLevels(levels);
      setIsEditing(false);
     };
     const savePromotionPath = async () => {
      const cleaned = draftLevels
       .map(level => ({
        title: String(level.title || '').trim(),
        items: (level.items || []).map(item => String(item || '').trim()).filter(Boolean)
       }))
       .filter(level => level.title);
      if (cleaned.length === 0) return triggerNotify?.("至少保留一個職務階段", "error");
      setSaving(true);
      try {
       await db.doc(getPublicPath('business/promotion_path')).set({
        levels: cleaned,
        updatedAt: Date.now()
       }, { merge: true });
       setLevels(cleaned);
       setDraftLevels(cleaned);
       setIsEditing(false);
       triggerNotify?.("升遷管道已更新", "success");
      } catch (e) {
       console.error("升遷管道儲存失敗", e);
       triggerNotify?.("升遷管道儲存失敗", "error");
      } finally {
       setSaving(false);
      }
     };

     return (
      <div className="p-4 space-y-5 page-enter text-left pb-20 font-bold">
       <div className="flex items-start justify-between gap-3">
        <BackButton onClick={onBack} title="升遷管道" />
        {isSuperAdmin && (
         <button onClick={() => isEditing ? savePromotionPath() : setIsEditing(true)} disabled={saving} className={`mt-1 shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black flex items-center gap-1.5 active:scale-95 transition-all shadow-sm ${isEditing ? 'bg-brand-red text-white' : 'bg-slate-900 text-white'}`}>
          <Icon name={saving ? "loader-2" : (isEditing ? "save" : "edit-3")} size={14} className={saving ? "animate-spin" : ""} />
          {saving ? "儲存中" : (isEditing ? "儲存" : "編輯")}
         </button>
        )}
       </div>
       <div className="glass-panel p-5 rounded-[2rem] bg-white border shadow-sm text-[11px] text-slate-500 leading-relaxed space-y-3">
        <p>該職務具備該職能後，才能再往上晉升。</p>
        {loadedAt && <p className="text-[10px] text-slate-400">最後更新：{new Date(loadedAt).toLocaleString()}</p>}
        {isSuperAdmin && isEditing && (
         <div className="flex gap-2 pt-2">
          <button onClick={addLevel} className="flex-1 py-3 rounded-2xl bg-emerald-50 text-emerald-700 border border-emerald-100 font-black text-xs flex items-center justify-center gap-2"><Icon name="plus" size={14} />新增職務階段</button>
          <button onClick={cancelEdit} className="px-5 py-3 rounded-2xl bg-slate-100 text-slate-500 border border-slate-200 font-black text-xs">取消</button>
         </div>
        )}
       </div>
       <div className="space-y-4">
        {activeLevels.map((level, idx) => (
         <div key={`${level.title}_${idx}`} className="space-y-3">
          <div className="glass-panel p-5 rounded-[2rem] bg-white border shadow-sm">
           <div className="flex items-center gap-3 mb-4">
            <div className="w-10 h-10 rounded-2xl bg-rose-50 text-brand-red border border-rose-100 flex items-center justify-center text-xs font-black shrink-0">{idx + 1}</div>
            {isEditing ? (
             <input value={level.title} onChange={e => updateLevelTitle(idx, e.target.value)} className="flex-1 input-light p-3 rounded-xl text-sm font-black outline-none border border-slate-200" placeholder="職務名稱" />
            ) : (
             <h3 className="text-lg font-black text-slate-800">{level.title}</h3>
            )}
            {isEditing && (
             <div className="flex gap-1 ml-auto">
              <button onClick={() => moveLevel(idx, -1)} disabled={idx === 0} className="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center disabled:opacity-30"><Icon name="chevron-up" size={15} /></button>
              <button onClick={() => moveLevel(idx, 1)} disabled={idx === activeLevels.length - 1} className="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center disabled:opacity-30"><Icon name="chevron-down" size={15} /></button>
              <button onClick={() => removeLevel(idx)} className="w-8 h-8 rounded-xl bg-red-50 text-red-500 flex items-center justify-center"><Icon name="trash-2" size={15} /></button>
             </div>
            )}
           </div>
           {isEditing ? (
            <div className="space-y-2">
             {(level.items || []).map((item, itemIdx) => (
              <div key={itemIdx} className="flex gap-2">
               <input value={item} onChange={e => updateItem(idx, itemIdx, e.target.value)} className="flex-1 input-light p-3 rounded-xl text-xs font-black outline-none border border-slate-200" placeholder="職能項目" />
               <button onClick={() => removeItem(idx, itemIdx)} className="w-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center"><Icon name="x" size={15} /></button>
              </div>
             ))}
             <button onClick={() => addItem(idx)} className="w-full py-3 rounded-xl border-2 border-dashed border-slate-200 text-slate-500 font-black text-xs flex items-center justify-center gap-2"><Icon name="plus" size={14} />新增職能</button>
            </div>
           ) : level.items.length > 0 ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
             {level.items.map(item => (
              <div key={item} className="flex items-start gap-2 bg-slate-50 border border-slate-100 rounded-2xl p-3">
               <Icon name="check-circle-2" size={15} className="text-emerald-600 shrink-0 mt-0.5" />
               <span className="text-xs font-black text-slate-700 leading-relaxed">{item}</span>
              </div>
             ))}
            </div>
           ) : (
            <p className="text-xs font-black text-brand-red bg-rose-50 border border-rose-100 rounded-2xl p-3">完成前述職能與幹部培訓後，進入主廚評估。</p>
           )}
          </div>
          {idx < levels.length - 1 && (
           <div className="flex justify-center text-brand-red">
            <Icon name="arrow-down" size={24} />
           </div>
          )}
         </div>
        ))}
       </div>
      </div>
     );
    };

    const OnboardingChecklistPage = ({ onBack, list = [], currentUser, currentBranch, getPublicPath, triggerNotify }) => {
     const [checkedIds, setCheckedIds] = useState([]);
     const [saving, setSaving] = useState(false);
     const itemIds = useMemo(() => (list || []).map((item, idx) => getOnboardingItemId(item, idx)), [list]);
     const doneCount = itemIds.filter(id => checkedIds.includes(id)).length;
     const percent = itemIds.length > 0 ? Math.round((doneCount / itemIds.length) * 100) : 0;
     const isComplete = itemIds.length > 0 && doneCount >= itemIds.length;

     useEffect(() => {
      if (!currentUser?.phone || !currentBranch) return;
      const unsub = db.collection(getPublicPath(`onboarding_checklists_${currentBranch}`)).doc(currentUser.phone).onSnapshot(doc => {
        const data = doc.exists ? doc.data() : {};
        setCheckedIds(data.year === getHygieneYear() && Array.isArray(data.checkedIds) ? data.checkedIds : []);
      }, () => {});
      return () => unsub();
     }, [currentUser?.phone, currentBranch]);

     const saveProgress = async (nextCheckedIds) => {
      if (!currentUser?.phone || !currentBranch) return;
      setSaving(true);
      const nextDone = itemIds.filter(id => nextCheckedIds.includes(id)).length;
      const nextPercent = itemIds.length > 0 ? Math.round((nextDone / itemIds.length) * 100) : 0;
      try {
        await db.collection(getPublicPath(`onboarding_checklists_${currentBranch}`)).doc(currentUser.phone).set({
         phone: currentUser.phone,
         userName: currentUser.name || '',
         branch: currentBranch,
         year: getHygieneYear(),
         checkedIds: nextCheckedIds,
         percent: nextPercent,
         totalCount: itemIds.length,
         doneCount: nextDone,
         completedAt: nextPercent === 100 ? Date.now() : null,
         updatedAt: Date.now()
        }, { merge: true });
      } catch (e) {
        triggerNotify("準備清單儲存失敗", "error");
      } finally {
        setSaving(false);
      }
     };

     const toggleItem = (id) => {
      const next = checkedIds.includes(id) ? checkedIds.filter(x => x !== id) : [...checkedIds, id];
      setCheckedIds(next);
      saveProgress(next);
     };

     return (
      <div className="p-4 space-y-5 page-enter pb-24 text-left font-bold">
       <BackButton onClick={onBack} title="員工準備清單" />
       <div className="glass-panel p-6 rounded-[2rem] bg-white border shadow-sm space-y-4">
        <div className="flex items-center justify-between gap-4">
         <div>
          <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">準備進度</p>
          <h3 className="text-3xl font-black text-slate-800 mt-1">{percent}%</h3>
         </div>
         {!isComplete && <span className="w-4 h-4 rounded-full bg-red-500 border-2 border-white shadow-lg animate-pulse"></span>}
         {isComplete && <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><Icon name="check-circle-2" size={24} /></div>}
        </div>
        <div className="h-3 bg-slate-100 rounded-full overflow-hidden">
         <div className={`h-full rounded-full transition-all ${isComplete ? 'bg-emerald-500' : 'bg-brand-red'}`} style={{width: `${percent}%`}}></div>
        </div>
        <p className="text-[11px] text-slate-500 leading-relaxed">
         請依序勾選已準備完成的項目；全部完成前，入職相關會持續顯示紅點提醒。每年 1/1 會重新提醒並重置勾選進度。
        </p>
       </div>
       <div className="space-y-3">
        {list && list.length > 0 ? list.map((item, idx) => {
         const id = getOnboardingItemId(item, idx);
         const checked = checkedIds.includes(id);
         return (
          <button key={id} onClick={() => toggleItem(id)} disabled={saving} className={`w-full glass-panel rounded-[2rem] p-5 border shadow-sm text-left flex gap-4 transition-all ${checked ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100 active:bg-slate-50'}`}>
           <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 border-2 ${checked ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-slate-200 text-slate-300'}`}>
            <Icon name={checked ? 'check' : 'circle'} size={18} />
           </div>
           <div className="min-w-0 flex-1">
            <h3 className={`font-black text-sm leading-tight ${checked ? 'text-emerald-700' : 'text-slate-800'}`}>{item.title || `項目 ${idx + 1}`}</h3>
            {item.content && <p className="text-[11px] text-slate-500 leading-relaxed mt-2 whitespace-pre-wrap">{item.content}</p>}
            {item.img && <img src={item.img} className="mt-3 w-full max-h-48 object-cover rounded-2xl border" />}
           </div>
          </button>
         );
        }) : <div className="py-20 text-center glass-panel rounded-[3rem] border border-slate-100 bg-white text-slate-300 font-bold uppercase text-[10px]">目前尚未發佈內容</div>}
       </div>
      </div>
     );
    };

    const HygieneTrainingPage = ({ onBack, currentUser, currentBranch, getPublicPath, triggerNotify, config = TRAINING_CONFIGS.hygiene }) => {
     const year = getHygieneYear();
     const [record, setRecord] = useState(null);
     const [uploading, setUploading] = useState(false);
     const normalizedRole = normalizeRole(currentUser?.role);
     const isRequired = HYGIENE_REQUIRED_ROLES.includes(normalizedRole);

     useEffect(() => {
     if (!currentUser?.phone || !currentBranch) return;
     const docId = `${currentUser.phone}_${year}`;
      const unsub = db.collection(getPublicPath(`${config.collectionPrefix}_${currentBranch}`)).doc(docId).onSnapshot(doc => {
        setRecord(doc.exists ? doc.data() : null);
      }, () => {});
      return () => unsub();
     }, [currentUser?.phone, currentBranch, year, config.collectionPrefix]);

     const handleUpload = (file) => {
      if (!file || !currentUser?.phone || uploading) return;
      setUploading(true);
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
         const proof = await compressImageToLimit(reader.result, { maxWidth: 1000, quality: 0.7, maxBytes: 780000, minWidth: 600, minQuality: 0.34 });
         const now = Date.now();
         await db.collection(getPublicPath(`${config.collectionPrefix}_${currentBranch}`)).doc(`${currentUser.phone}_${year}`).set({
          phone: currentUser.phone,
          userName: currentUser.name || '',
          role: normalizedRole,
          branch: currentBranch,
          year,
          status: 'completed',
          proof,
          proofName: file.name || '',
          trainingKey: config.key,
          trainingTitle: config.title,
          completedAt: now,
          updatedAt: now
         }, { merge: true });
         triggerNotify(`${config.shortTitle}證明已上傳`, "success");
        } catch (e) {
         triggerNotify("證明上傳失敗，請換一張較小的圖片再試", "error");
        } finally {
         setUploading(false);
        }
      };
      reader.readAsDataURL(file);
     };

     return (
      <div className="p-4 space-y-5 page-enter pb-24 text-left font-bold">
       <BackButton onClick={onBack} title={config.title} />
       <div className="glass-panel p-6 rounded-[2rem] bg-white border shadow-sm space-y-4">
        <div className="flex items-start justify-between gap-4">
         <div>
          <p className="text-[10px] font-black text-brand-red uppercase tracking-widest">{year} 年度</p>
          <h3 className="text-xl font-black text-slate-800 mt-1">{config.headline}</h3>
         </div>
         <span className={`px-3 py-1 rounded-full text-[10px] font-black ${record?.status === 'completed' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'}`}>{record?.status === 'completed' ? '已完成' : '未完成'}</span>
        </div>
        <p className="text-xs text-slate-600 leading-relaxed">
         {config.intro}
        </p>
        {!isRequired && <p className="text-[11px] bg-slate-50 border border-slate-100 text-slate-500 p-3 rounded-2xl">目前職務為「{normalizedRole}」，此項主要追蹤內場正職/計時人員與內場主管。</p>}
        <button onClick={() => window.open(config.portalUrl, '_blank')} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 active:scale-95 transition-all">
         <Icon name="external-link" size={16} /> {config.portalLabel}
        </button>
       </div>

       <div className="glass-panel p-6 rounded-[2rem] bg-white border shadow-sm space-y-3">
        <h3 className="font-black text-slate-800 text-sm flex items-center gap-2"><Icon name="book-open-check" size={18} className="text-brand-red" /> {config.courseHeading}</h3>
        <p className="text-[11px] text-slate-500 leading-relaxed">{config.courseIntro}</p>
        <div className="space-y-2">
         {config.courses.map((course, idx) => (
          <button key={course.url} onClick={() => window.open(course.url, '_blank')} className="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 flex gap-3 items-start text-left active:bg-slate-100">
           <span className="w-7 h-7 rounded-full bg-white text-brand-red flex items-center justify-center text-[10px] font-black shrink-0 border">{idx + 1}</span>
           <span className="text-xs font-black text-slate-700 leading-relaxed flex-1">{course.title}</span>
           <Icon name="external-link" size={14} className="text-slate-300 shrink-0" />
          </button>
         ))}
        </div>
       </div>

       <div className="glass-panel p-6 rounded-[2rem] bg-white border shadow-sm space-y-4">
        <h3 className="font-black text-slate-800 text-sm flex items-center gap-2"><Icon name="image-up" size={18} className="text-brand-red" /> 上傳完課證明</h3>
        <div className="bg-amber-50 border border-amber-100 text-amber-800 p-4 rounded-2xl text-[11px] leading-relaxed">
         {config.uploadHint}
        </div>
        {record?.proof && (
         <div className="space-y-2">
          <img src={record.proof} className="w-full rounded-2xl border bg-slate-50 object-contain max-h-80" />
          <p className="text-[10px] text-emerald-600 font-black">完成時間：{new Date(record.completedAt || record.updatedAt).toLocaleString()}</p>
         </div>
        )}
        <label className={`w-full block text-center py-4 rounded-2xl font-black text-sm cursor-pointer active:scale-95 transition-all ${uploading ? 'bg-slate-200 text-slate-400' : 'bg-brand-red text-white shadow-lg shadow-brand-red/20'}`}>
         {uploading ? '上傳中...' : (record?.proof ? '重新上傳證明' : '上傳證明圖片')}
         <input type="file" accept="image/*" className="hidden" disabled={uploading} onChange={e => handleUpload(e.target.files?.[0])} />
        </label>
       </div>
      </div>
     );
    };

    const SyncInput = ({ value, onChange, readOnly, className, maxLength, placeholder, autoFocus }) => {
     const [localVal, setLocalVal] = useState(value || '');
     useEffect(() => { setLocalVal(value || ''); }, [value]);
     return (
      <input
        type="text"
        value={localVal}
        onChange={e => setLocalVal(e.target.value)}
        onBlur={() => { if(localVal !== (value || '')) onChange(localVal); }}
        onKeyDown={e => { if(e.key === 'Enter') e.target.blur(); }}
        readOnly={readOnly}
        className={className}
        maxLength={maxLength}
        placeholder={placeholder}
        autoFocus={autoFocus}
      />
     );
    };
    
    const OrderQtyInput = ({ value, onChange, unit }) => {
     const [localVal, setLocalVal] = useState(value || 0);
     useEffect(() => { setLocalVal(value || 0); }, [value]);
     
     return (
      <div className="w-12 text-center flex flex-col items-center justify-center">
        <input 
         type="number" 
         min="0"
         step="any"
         value={localVal === 0 || localVal === '0' ? '' : localVal} 
         onChange={(e) => setLocalVal(e.target.value)}
         onBlur={(e) => {
           const val = parseFloat(e.target.value) || 0;
           setLocalVal(val);
           if (val !== (value || 0)) onChange(val);
         }}
         onKeyDown={e => { if(e.key === 'Enter') e.target.blur(); }}
         placeholder="0"
         className={`w-full text-xl font-black text-center bg-transparent outline-none p-0 border-none m-0 h-6 ${(!localVal || localVal === 0) ? 'text-slate-300' : 'text-[var(--accent)]'}`}
         style={{ WebkitAppearance: 'none', margin: 0, MozAppearance: 'textfield' }}
        />
        <p className="text-[9px] text-slate-400 font-black leading-none mt-1">{unit}</p>
      </div>
     );
    };

    const ScheduleSystem = ({ onBack, currentBranch, isManager, getPublicPath, triggerNotify, publishContent }) => {
     const defaultShiftRules = [
      { code: 'A-5', name: '早班A5', type: 'morning' },
      { code: 'A-6', name: '早班A6', type: 'morning' },
      { code: 'P1', name: '晚班P1', type: 'evening' },
      { code: 'P4', name: '晚班P4', type: 'evening' },
      { code: 'P5', name: '晚班P5', type: 'evening' },
      { code: 'P6', name: '晚班P6', type: 'evening' },
      { code: 'F', name: '全天班', type: 'full' },
      { code: '特', name: '特休', type: 'off' },
      { code: 'X', name: '排休', type: 'off' },
      { code: '/', name: '劃休', type: 'off' }
     ];

     // 強制班表樣式：注入最高優先級 CSS 到 document.head
     useEffect(() => {
      const id = 'sc-force-style';
      let el = document.getElementById(id);
      if (!el) { el = document.createElement('style'); el.id = id; document.head.appendChild(el); }
      el.textContent = `
        html body #schedule-root table td { background:#fff!important; background-color:#fff!important; color:#1e293b!important; }
        html body #schedule-root table th { background:#fff!important; background-color:#fff!important; color:#1e293b!important; }
        html body #schedule-root table td.sc-weekend,html body #schedule-root table th.sc-weekend { background:#fed7d7!important; background-color:#fed7d7!important; color:#9f1239!important; }
        html body #schedule-root table td.sc-red-hol,html body #schedule-root table th.sc-red-hol { background:#fca5a5!important; background-color:#fca5a5!important; color:#7f1d1d!important; }
        html body #schedule-root table td.sc-gray-hol,html body #schedule-root table th.sc-gray-hol { background:#e2e8f0!important; background-color:#e2e8f0!important; color:#334155!important; }
        html body #schedule-root table td.sc-white,html body #schedule-root table th.sc-white { background:#fff!important; background-color:#fff!important; color:#1e293b!important; }
        html body #schedule-root table td.sc-yellow,html body #schedule-root table th.sc-yellow { background:#fde047!important; background-color:#fde047!important; color:#713f12!important; }
        html body #schedule-root table th.sc-hdr-wknd { background:#fecdd3!important; background-color:#fecdd3!important; color:#9f1239!important; }
        html body #schedule-root table th.sc-hdr-red  { background:#fca5a5!important; background-color:#fca5a5!important; color:#7f1d1d!important; }
        html body #schedule-root table th.sc-hdr-gray { background:#e2e8f0!important; background-color:#e2e8f0!important; color:#334155!important; }
        html body #schedule-root table th.sc-hdr-plain{ background:#f1f5f9!important; background-color:#f1f5f9!important; color:#1e293b!important; }
        html body #schedule-root table td.title-cell,html body #schedule-root table td.name-cell { background-color:var(--cell-bg,#f8fafc)!important; color:var(--cell-color,#1e293b)!important; }
        html body #schedule-root table td.off-days-cell { background:#f1f5f9!important; color:#475569!important; }
        html body #schedule-root input,html body #schedule-root textarea { background:transparent!important; color:inherit!important; }
        html body #schedule-root .text-slate-800,html body #schedule-root .text-slate-900 { color:#1e293b!important; }
        html body #schedule-root .text-slate-700 { color:#334155!important; }
        html body #schedule-root .text-slate-600 { color:#475569!important; }
        html body #schedule-root .text-slate-500 { color:#64748b!important; }
        html body #schedule-root .text-brand-red,html body #schedule-root .text-red-700 { color:#b9121b!important; }
        html body #schedule-root .bg-emerald-500 { background:#10b981!important; color:#fff!important; }
      `;
      return () => { const s = document.getElementById(id); if(s) s.remove(); };
     }, []);
          const [scheduleData, setScheduleData] = useState({
      shiftRules: defaultShiftRules,
      roleColors: {},
      months: {} // 存放各月份獨立資料
     });
     const [currentDate, setCurrentDate] = useState(new Date()); 
     const [newShiftCode, setNewShiftCode] = useState('');
     const [newShiftType, setNewShiftType] = useState('morning');
     const [showSettings, setShowSettings] = useState(false);
     const [selectedCell, setSelectedCell] = useState(null);
     
     const [isHighlightMode, setIsHighlightMode] = useState(false);
     
     const [holidayInputText, setHolidayInputText] = useState('');
     const [holidayInputIsRed, setHolidayInputIsRed] = useState(true);

     const [draggedStaffId, setDraggedStaffId] = useState(null);
     const [overStaffId, setOverStaffId] = useState(null);
     const [isDownloading, setIsDownloading] = useState(false);
     const [previewImage, setPreviewImage] = useState(null);
     const tableRef = useRef(null);

     useEffect(() => {
      const docRef = db.doc(getPublicPath(`schedules_data/branch_${currentBranch}`));
      const unsubscribe = docRef.onSnapshot(doc => {
        if (doc.exists) {
         setScheduleData(doc.data());
        } else {
         const defaultData = { shiftRules: defaultShiftRules, roleColors: {}, months: {} };
         if(isManager) docRef.set(defaultData);
         setScheduleData(defaultData);
        }
      });
      return () => unsubscribe();
     }, [currentBranch, isManager]);

     const { shiftRules = defaultShiftRules, roleColors = {} } = scheduleData;
     
     const monthKey = useMemo(() => `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`, [currentDate]);
     const activeMonthData = scheduleData.months?.[monthKey] || null;
     const publishedMonthData = activeMonthData?.publishedSnapshot || null;
     const isMonthPublished = !!publishedMonthData;

     const staffList = useMemo(() => {
      if (activeMonthData) {
       if (isManager) return activeMonthData.staffList || [];
       return publishedMonthData?.staffList || [];
      }
      if (!isManager) return [];
      if (scheduleData.months) {
        const pastMonths = Object.keys(scheduleData.months)
         .filter(k => k < monthKey)
         .sort((a, b) => b.localeCompare(a));
        if (pastMonths.length > 0) {
         const latestPastMonth = pastMonths[0];
         return (scheduleData.months[latestPastMonth].staffList || []).map(s => ({...s, shifts: {}}));
        }
      }
      return scheduleData.staffList || []; 
     }, [activeMonthData, publishedMonthData, isManager, scheduleData.months, scheduleData.staffList, monthKey]);

     const holidays = useMemo(() => {
      if (activeMonthData) {
       if (isManager) return activeMonthData.holidays || {};
       return publishedMonthData?.holidays || {};
      }
      if (!isManager) return {};
      if (!scheduleData.months) return scheduleData.holidays || {};
      return {};
     }, [activeMonthData, publishedMonthData, isManager, scheduleData.months, scheduleData.holidays]);

     const getHolidayData = useCallback((dateString) => {
      const h = holidays[dateString];
      if (!h) return null;
      if (typeof h === 'string') return { text: h, isRed: true };
      return h;
     }, [holidays]);

     const updateData = (updates) => {
      if (!isManager) return;
      db.doc(getPublicPath(`schedules_data/branch_${currentBranch}`)).set(updates, { merge: true });
     };

     const updateMonthData = async (updateCallback) => {
      if (!isManager) return;
      const docRef = db.doc(getPublicPath(`schedules_data/branch_${currentBranch}`));

      try {
        await db.runTransaction(async (transaction) => {
         const docSnap = await transaction.get(docRef);
     
         if (!docSnap.exists) {
           const currentMonthData = { staffList: [], holidays: {} };
           const updatedMonthData = updateCallback(currentMonthData);
           const finalMonthData = { ...currentMonthData, ...updatedMonthData };
      
           transaction.set(docRef, {
            shiftRules: defaultShiftRules,
            roleColors: {},
            months: { [monthKey]: finalMonthData }
           });
           return; // 直接寫入並結束，不報錯
         }

         const data = docSnap.data();
         const currentMonthData = (data.months && data.months[monthKey]) 
           ? data.months[monthKey] 
           : { staffList: [], holidays: {} };
     
         const updatedMonthData = updateCallback(currentMonthData);
         const finalMonthData = { ...currentMonthData, ...updatedMonthData };

         if (data.months === undefined) {
           transaction.set(docRef, {
            months: { [monthKey]: finalMonthData }
           }, { merge: true });
         } 
         else {
           transaction.update(docRef, {
            [`months.${monthKey}`]: finalMonthData
           });
         }
         });
         return true;
       } catch (e) {
         console.error("更新班表失敗: ", e);
         triggerNotify("排班儲存異常，請稍後再試", "error");
         return false;
       }
      };

      const handlePublishSchedule = async () => {
       if (!isManager) return;
       const publishedAt = Date.now();
       const saved = await updateMonthData(currentMonthData => ({
        publishedSnapshot: {
         staffList: currentMonthData.staffList || [],
         holidays: currentMonthData.holidays || {},
         publishedAt
        }
       }));
       if (!saved) return;
       await publishContent('schedule', `${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月班表已更新`);
      };

     const setShiftRules = (newRules) => updateData({ shiftRules: newRules });
     const addShiftRule = () => {
      if (!newShiftCode.trim()) return;
      const code = newShiftCode.trim().toUpperCase();
      if (shiftRules.some(r => r.code === code)) return triggerNotify('班別代碼已存在！', 'error');
      setShiftRules([...shiftRules, { code, name: code, type: newShiftType }]);
      setNewShiftCode('');
     };
     const removeShiftRule = (codeToRemove) => setShiftRules(shiftRules.filter(r => r.code !== codeToRemove));

     const daysInMonth = useMemo(() => {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const days = new Date(year, month + 1, 0).getDate();
      return Array.from({ length: days }, (_, i) => {
        const date = new Date(year, month, i + 1);
        return {
         dateNum: i + 1,
         dayOfWeek: ['日', '一', '二', '三', '四', '五', '六'][date.getDay()],
         isWeekend: date.getDay() === 0 || date.getDay() === 6,
         dateString: `${year}-${String(month + 1).padStart(2, '0')}-${String(i + 1).padStart(2, '0')}`
        };
      });
     }, [currentDate]);

     const changeMonth = (offset) => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1));

     const updateShift = (staffId, dateString, value) => {
      if (!isManager) return;
      const safeValue = value || '';
  
      updateMonthData((latestMonthData) => {
        const currentStaffList = latestMonthData.staffList || [];
        const newStaffList = currentStaffList.map(staff => 
         staff.id === staffId 
           ? { ...staff, shifts: { ...(staff.shifts || {}), [dateString]: safeValue } } 
           : staff
        );
        return { staffList: newStaffList };
      });
     };

     const toggleCellColor = (staffId, dateString) => {
      if (!isManager) return;
      const cellKey = `${staffId}_${dateString}`;
  
      updateMonthData((latestMonthData) => {
        const currentColors = latestMonthData.cellColors || {};
        const newColors = { ...currentColors };
    
        if (newColors[cellKey] === 'bg-yellow-300') {
         delete newColors[cellKey];
        } else {
         newColors[cellKey] = 'bg-yellow-300';
        }
        return { cellColors: newColors };
      });
     };
     const addStaff = () => {
      if (!isManager) return;
      const newId = Date.now().toString(); 
  
      updateMonthData((latestMonthData) => {
        const currentStaffList = latestMonthData.staffList || [];
        return { staffList: [...currentStaffList, { id: newId, title: '新職位', name: '新員工', shifts: {} }] };
      });
     };

     const updateStaffInfo = (id, field, value) => {
      if (!isManager) return;
  
      updateMonthData((latestMonthData) => {
        const currentStaffList = latestMonthData.staffList || [];
        const newStaffList = currentStaffList.map(staff => 
         staff.id === id ? { ...staff, [field]: value } : staff
        );
        return { staffList: newStaffList };
      });
     };

     const removeStaff = (id) => {
      if (!isManager) return;
      if(window.confirm('確定刪除此人員本月班表？')) {
        updateMonthData((latestMonthData) => {
         const currentStaffList = latestMonthData.staffList || [];
         return { staffList: currentStaffList.filter(staff => staff.id !== id) };
        });
      }
     };
     
     const importPreviousData = () => {
      if (!isManager) return;
      
      const pastMonths = scheduleData.months 
        ? Object.keys(scheduleData.months).filter(k => k < monthKey).sort((a, b) => b.localeCompare(a)) 
        : [];

      if (pastMonths.length === 0) {
        triggerNotify("找不到過去的月份資料可供載入", "error");
        return;
      }

      const lastMonthKey = pastMonths[0];
      const lastStaffList = scheduleData.months[lastMonthKey].staffList || [];

      if (lastStaffList.length === 0) {
        triggerNotify(`上個月 (${lastMonthKey}) 沒有人員資料`, "error");
        return;
      }

      if (window.confirm(`確定要載入 ${lastMonthKey} 的人員名單與職位嗎？\n(注意：這會清空當月已排的班表，並套用上月名單)`)) {
        const importedStaff = lastStaffList.map(staff => ({
         ...staff,
         shifts: {} 
        }));

        updateMonthData((latestMonthData) => {
         return { staffList: importedStaff };
        });
        triggerNotify(`已成功載入 ${lastMonthKey} 人員名單！`, "success");
      }
     };

     const openHolidayEdit = (dateString) => {
      if (!isManager) return;
      const h = getHolidayData(dateString);
      setHolidayInputText(h ? h.text : '');
      setHolidayInputIsRed(h ? h.isRed : true);
      setSelectedCell({ type: 'holiday', date: dateString });
     };

     const saveHoliday = (dateString) => {
      if (!isManager) return;
  
      updateMonthData((latestMonthData) => {
        const currentHolidays = latestMonthData.holidays || {};
        const newHolidays = { ...currentHolidays };
    
        if (holidayInputText.trim() === '') {
         delete newHolidays[dateString];
        } else {
         newHolidays[dateString] = { 
           text: holidayInputText.trim(), 
           isRed: holidayInputIsRed 
         };
        }
    
        return { holidays: newHolidays };
      });
  
      setSelectedCell(null);
     };

     const deleteHoliday = (dateString) => {
      if (!isManager) return;
  
      updateMonthData((latestMonthData) => {
        const currentHolidays = latestMonthData.holidays || {};
        const newHolidays = { ...currentHolidays };
        delete newHolidays[dateString];
    
        return { holidays: newHolidays };
      });
  
      setSelectedCell(null);
     };
     const handleDragStart = (id) => { if (!isManager) return; setDraggedStaffId(id); };
     const handleDragOver = (e, id) => { e.preventDefault(); if (!isManager) return; if (id !== draggedStaffId) setOverStaffId(id); };
     const handleDragEnd = () => {
      if (!isManager) return;
      if (draggedStaffId !== null && overStaffId !== null && draggedStaffId !== overStaffId) {
    
        updateMonthData((latestMonthData) => {
         const currentStaffList = latestMonthData.staffList || [];
         const newList = [...currentStaffList];
         const fromIndex = newList.findIndex(s => s.id === draggedStaffId);
         const toIndex = newList.findIndex(s => s.id === overStaffId);

         if (fromIndex !== -1 && toIndex !== -1) {
           const [moved] = newList.splice(fromIndex, 1);
           newList.splice(toIndex, 0, moved);
           return { staffList: newList };
         }
         return {}; // 沒變動就回傳空物件
        });
      }
      setDraggedStaffId(null);
      setOverStaffId(null);
     };

     const calculateOffDays = (shifts = {}) => {
      let count = 0;
      daysInMonth.forEach(day => {
        const code = shifts[day.dateString];
        if (!code) return;
        const rule = shiftRules.find(r => r.code === code);
        if (rule && rule.type === 'off') {
         count++;
        } else if (code === 'X' || code === '/' || code === '特') {
         count++;
        }
      });
      return count;
     };

     const calculateDailyStats = (dateString) => {
      let morning = 0; let evening = 0; let total = 0;
      staffList.forEach(staff => {
        const shifts = staff.shifts || {};
        const shiftCode = shifts[dateString] || '';
        if (shiftCode === '') { morning++; evening++; total++; return; }
        const rule = shiftRules.find(r => r.code === shiftCode);
        if (rule) {
         if (rule.type === 'morning' || rule.type === 'full') morning++;
         if (rule.type === 'evening' || rule.type === 'full') evening++;
         if (rule.type !== 'off') total++;
        } else if (shiftCode !== 'X' && shiftCode !== '/' && shiftCode !== '特') {
         total++;
        }
      });
      return { morning, evening, total };
     };

     const getTitleColorStyle = useCallback((title) => {
      if (!title) return { backgroundColor: '#f8fafc', color: '#64748b' };
      if (roleColors[title]) {
        const bg = roleColors[title];
        const hex = bg.replace('#', '');
        const r = parseInt(hex.substr(0, 2), 16) || 255;
        const g = parseInt(hex.substr(2, 2), 16) || 255;
        const b = parseInt(hex.substr(4, 2), 16) || 255;
        const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
        const text = (yiq >= 128) ? '#1e293b' : '#ffffff';
        return { backgroundColor: bg, color: text };
      }
      const colors = [
        {bg: '#dcfce7', text: '#065f46'}, {bg: '#dbeafe', text: '#3730a3'}, 
        {bg: '#ffedd5', text: '#c2410c'}, {bg: '#fce7f3', text: '#be123c'}, 
        {bg: '#e0e7ff', text: '#3f0071'}, {bg: '#f3e8ff', text: '#4338ca'}, 
        {bg: '#cffafe', text: '#1e40af'}, 
      ];
      let hash = 0;
      for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
      const colorIdx = Math.abs(hash) % colors.length;
      return { backgroundColor: colors[colorIdx].bg, color: colors[colorIdx].text };
     }, [roleColors]);

     const getCellBg = useCallback((dateString, isWeekend) => {
      const h = getHolidayData(dateString);
      if (h && h.isRed) return 'sc-red-hol';
      if (h && !h.isRed) return 'sc-gray-hol';
      if (isWeekend) return 'sc-weekend';
      return 'sc-white';
     }, [getHolidayData]);

     const isRedDay = useCallback((dateString, isWeekend) => {
      const h = getHolidayData(dateString);
      return isWeekend || (h && h.isRed);
     }, [getHolidayData]);

     const getHeaderBg = useCallback((dateString, isWeekend) => {
      const h = getHolidayData(dateString);
      if (h && h.isRed) return 'sc-hdr-red font-black';
      if (h && !h.isRed) return 'sc-hdr-gray font-black';
      if (isWeekend) return 'sc-hdr-wknd font-black';
      return 'sc-hdr-plain font-bold';
     }, [getHolidayData]);

     const handleDownloadImage = async () => {
      if (!tableRef.current) return;
      
      setIsDownloading(true);
      triggerNotify("正在展開表格並準備拍攝，請稍候...", "info");
      
      setTimeout(async () => {
        const target = tableRef.current;
        const parent = target.parentElement;
        
        const originalOverflow = parent.style.overflow;
        const originalWidth = parent.style.width;
        const originalPosition = parent.style.position;
        
        parent.style.overflow = 'visible';
        parent.style.width = 'max-content';
        parent.style.position = 'static';
        
        try {
         const canvas = await window.html2canvas(target, {
           scale: 2, 
           useCORS: true,
           backgroundColor: '#ffffff',
           width: target.scrollWidth,
           height: target.scrollHeight,
           windowWidth: target.scrollWidth,
           windowHeight: target.scrollHeight
         });

         const imgData = canvas.toDataURL('image/jpeg', 0.9);
         
         setPreviewImage(imgData);
         triggerNotify("班表截圖成功！", "success");
        } catch (error) {
         console.error("產生圖片失敗", error);
         triggerNotify("下載圖片失敗，請稍後再試", "error");
        } finally {
         parent.style.overflow = originalOverflow;
         parent.style.width = originalWidth;
         parent.style.position = originalPosition;
         setIsDownloading(false);
        }
      }, 500);
     };

     const handlePrint = () => {
      const monthStr = `${currentDate.getMonth() + 1}月`;
      const yearMonthTitle = `${currentDate.getFullYear()}年 ${monthStr} 班表`;
      const escapeHtml = (value) => String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
      
      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
         <title>${currentBranch} - ${yearMonthTitle}</title>
         <style>
           @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
           @page { size: landscape; margin: 5mm; }
           body { font-family: 'Noto Sans TC', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0; padding: 0; color: #1e293b; }
           h1 { text-align: center; font-size: 20px; font-weight: 900; margin-bottom: 12px; color: #b9121b; letter-spacing: 2px; }
           table { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; }
           th, td { border: 1px solid #475569; padding: 2px 0; overflow: hidden; white-space: nowrap; font-size: 10px; font-weight: 700; }
           .bg-header { background-color: #a7f3d0 !important; font-size: 12px; }
           .bg-header-dark { background-color: #34d399 !important; color: white; font-size: 11px; }
           .bg-weekend { background-color: #ffe4e6 !important; color: #e11d48 !important; }
           .bg-holiday { background-color: #fecaca !important; color: #b91c1c !important; } 
           .holiday-cell { height: 86px; min-height: 86px; vertical-align: top; overflow: visible; white-space: normal !important; padding: 2px 0; }
           .text-holiday { color: #b91c1c !important; display: inline-block; height: 82px; max-height: 82px; writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; text-orientation: upright; -webkit-text-orientation: upright; white-space: normal !important; word-break: keep-all; overflow: visible; font-size: 12px; letter-spacing: 1px; font-weight: 900; margin: 0 auto; line-height: 1.1; }
           .bg-gray { background-color: #f8fafc !important; }
           .bg-dark { background-color: #1e293b !important; color: white !important; font-size: 11px; }
           .bg-orange { background-color: #ffedd5 !important; color: #9a3412 !important; font-size: 11px; }
           .bg-indigo { background-color: #e0e7ff !important; color: #3730a3 !important; font-size: 11px; }
           .print-footer { text-align: right; font-size: 9px; color: #94a3b8; margin-top: 10px; }
         </style>
        </head>
        <body>
         <h1>${currentBranch} - ${yearMonthTitle}</h1>
         <table>
           <colgroup>
            <col style="width: 60px;" />
            <col style="width: 65px;" />
            <col style="width: 28px;" />
            ${daysInMonth.map(() => `<col />`).join('')}
           </colgroup>
           <thead>
            <tr>
              <th colspan="3" class="bg-header">${monthStr}</th>
              ${daysInMonth.map(d => {
               const h = getHolidayData(d.dateString);
               return `<th class="${(h && h.isRed) ? 'bg-holiday' : ((h && !h.isRed) ? 'bg-gray' : (d.isWeekend ? 'bg-weekend' : 'bg-gray'))}">${d.dateNum}</th>`;
              }).join('')}
            </tr>
            <tr>
              <th class="bg-header-dark">職稱</th>
              <th class="bg-header-dark">姓名</th>
              <th class="bg-header-dark">休假</th>
              ${daysInMonth.map(d => {
               const h = getHolidayData(d.dateString);
               return `<th class="${(h && h.isRed) ? 'bg-holiday' : ((h && !h.isRed) ? 'bg-gray' : (d.isWeekend ? 'bg-weekend' : 'bg-gray'))}">${d.dayOfWeek}</th>`;
              }).join('')}
            </tr>
            <tr>
              <th colspan="3" style="text-align:right; font-size: 9px; color: #94a3b8; font-weight: normal; padding-right: 4px;">特殊節日 ➔</th>
              ${daysInMonth.map(d => {
               const h = getHolidayData(d.dateString);
               return `<th class="holiday-cell ${(h && h.isRed) ? 'bg-holiday' : ((h && !h.isRed) ? 'bg-gray' : (d.isWeekend ? 'bg-weekend' : ''))}">
                 ${h ? `<div class="text-holiday" style="${!h.isRed ? 'color:#475569 !important;' : ''}">${escapeHtml(h.text)}</div>` : ''}
               </th>`;
              }).join('')}
            </tr>
           </thead>
           <tbody>
            ${staffList.map((staff, idx) => {
              const roleStyle = getTitleColorStyle(staff.title);
              return `
              <tr>
               <td style="font-weight:bold; font-size: 11px; background-color: ${roleStyle.backgroundColor} !important; color: ${roleStyle.color} !important;">${staff.title}</td>
               <td class="${idx % 2 === 0 ? 'bg-gray' : ''}" style="font-size: 13px; letter-spacing: 1px;">${staff.name}</td>
               <td class="bg-gray" style="color:#475569; font-size: 11px;">${calculateOffDays(staff.shifts)}</td>
               ${daysInMonth.map(d => {
                 const shift = (staff.shifts || {})[d.dateString] || '';
                 const h = getHolidayData(d.dateString);
                 const cellKey = `${staff.id}_${d.dateString}`;
                 const isHighlighted = (activeMonthData?.cellColors || {})[cellKey] === 'bg-yellow-300';
                 
                 let tdClass = (h && h.isRed) ? 'bg-holiday' : ((h && !h.isRed) ? 'bg-gray' : (d.isWeekend ? 'bg-weekend' : ''));
                 let tdStyle = "text-transform: uppercase; font-size: 10px;";
                 
                 if (isHighlighted) {
                  tdClass = '';
                  tdStyle += " background-color: #fde047 !important;";
                 }
                 
                 return `<td class="${tdClass}" style="${tdStyle}">${shift}</td>`;
               }).join('')}
              </tr>
              `;
            }).join('')}
           </tbody>
           <tfoot>
            <tr>
              <td colspan="3" class="bg-orange" style="text-align: right; padding-right: 4px;">早班總人數</td>
              ${daysInMonth.map(d => `<td class="bg-orange">${calculateDailyStats(d.dateString).morning || ''}</td>`).join('')}
            </tr>
            <tr>
              <td colspan="3" class="bg-indigo" style="text-align: right; padding-right: 4px;">晚班總人數</td>
              ${daysInMonth.map(d => `<td class="bg-indigo">${calculateDailyStats(d.dateString).evening || ''}</td>`).join('')}
            </tr>
            <tr>
              <td colspan="3" class="bg-dark" style="text-align: right; padding-right: 4px;">當日總人數</td>
              ${daysInMonth.map(d => `<td class="bg-dark">${calculateDailyStats(d.dateString).total || ''}</td>`).join('')}
            </tr>
           </tfoot>
         </table>
         <div class="print-footer">EATJOY 廚務管理系統 - 列印時間：${new Date().toLocaleString()}</div>
        </body>
        </html>
      `;
      
      const printWindow = window.open('', '_blank');
      printWindow.document.write(htmlContent);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => { 
        printWindow.print(); 
        printWindow.close(); 
      }, 500);
     };

     return (
      <div className="page-enter pb-24" id="schedule-root" onClick={() => setSelectedCell(null)}>
        
        <div className="p-3 sm:p-4 border-b bg-[rgba(255,255,255,0.8)] backdrop-blur sticky top-[60px] z-40 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
         <div className="flex items-center gap-3 w-full md:w-auto">
           <button onClick={onBack} className="p-2 sm:p-2.5 glass-panel rounded-xl sm:rounded-2xl border border-[#cbd5e1] active:scale-90 transition-all bg-[#ffffff] shadow-sm shrink-0"><Icon name="arrow-left" size={20}/></button>
           <h2 className="text-lg sm:text-xl font-black text-[#1e293b] tracking-tighter truncate">{currentBranch} <span className="text-brand-red">排班系統</span></h2>
         </div>
         <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
           <button onClick={handleDownloadImage} disabled={isDownloading} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-[#3b82f6] text-[#ffffff] rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap disabled:opacity-50">
            <Icon name="image" size={14} /> {isDownloading ? "處理中" : "存為圖片"}
           </button>
           <button onClick={handlePrint} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-[#059669] text-[#ffffff] rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap">
            <Icon name="printer" size={14} /> 列印
           </button>
           {isManager && (
            <>
              <button onClick={importPreviousData} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-[#4f46e5] text-[#ffffff] rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap">
               <Icon name="copy" size={14} /> 載入上月
              </button>
              <button onClick={() => setIsHighlightMode(!isHighlightMode)} className={`flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap ${isHighlightMode ? 'bg-yellow-400 text-[#713f12] border border-[#eab308] shadow-inner' : 'bg-[#f1f5f9] text-[#334155] border border-[#cbd5e1]'}`}>
               <Icon name="edit-3" size={14} /> {isHighlightMode ? '結束標記' : '標記修改'}
              </button>
               <button onClick={handlePublishSchedule} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-brand-red text-[#ffffff] rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap">
                <Icon name="send" size={14} /> {isMonthPublished ? '更新發布' : '發布班表'}
               </button>
              <button onClick={addStaff} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-[#1e293b] text-[#ffffff] rounded-xl active:scale-95 transition-all shadow-sm text-xs sm:text-sm font-bold whitespace-nowrap"><Icon name="plus" size={14} /> 新增</button>
              <button onClick={() => setShowSettings(!showSettings)} className="flex-1 md:flex-none justify-center flex items-center gap-1.5 px-3 py-2 sm:py-2.5 bg-[#f1f5f9] text-[#334155] rounded-xl border border-[#cbd5e1] active:scale-95 transition-all text-xs sm:text-sm font-bold whitespace-nowrap"><Icon name="settings" size={14} /> 設定</button>
            </>
           )}
         </div>
        </div>

         <div className="p-4">
          {!isManager && !isMonthPublished && (
           <div className="mb-4 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-center">
            <p className="font-black text-amber-800 text-sm">本月份班表尚未發布</p>
            <p className="mt-1 text-xs font-bold text-amber-600">主管完成排班並按下發布後，才會顯示正式班表。</p>
           </div>
          )}
         {isManager && showSettings && (
           <div className="mb-4 p-5 bg-[#eff6ff] border border-[#bfdbfe] rounded-3xl shadow-sm text-left animate-in slide-in-from-top-2">
            <h3 className="font-black text-[#1e40af] mb-3 flex items-center gap-2 text-sm"><Icon name="settings" size={16} /> 班別代碼與統計歸類設定</h3>
            <div className="flex flex-wrap gap-2 mb-4">
              {shiftRules.map((rule, idx) => (
               <div key={idx} className="flex items-center bg-[#ffffff] py-1.5 px-3 rounded-xl shadow-sm border border-[#bfdbfe] text-xs font-bold group">
                 <span className="w-8 text-center text-[#1d4ed8]">{rule.code}</span>
                 <span className="mx-2 text-[#cbd5e1]">|</span>
                 <select value={rule.type} onChange={(e) => { const newRules = [...shiftRules]; newRules[idx].type = e.target.value; setShiftRules(newRules); }} className="outline-none bg-transparent text-[#475569] cursor-pointer appearance-none">
                  <option value="morning">早班</option><option value="evening">晚班</option><option value="full">全天(早+晚)</option><option value="off">休假(不計入)</option>
                 </select>
                 <button onClick={() => removeShiftRule(rule.code)} className="ml-2 text-[#cbd5e1] hover:text-[#ef4444] opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" size={14} /></button>
               </div>
              ))}
            </div>
            <div className="pt-3 border-t border-[#bfdbfe] flex flex-wrap items-center gap-2">
              <input type="text" value={newShiftCode} onChange={(e) => setNewShiftCode(e.target.value)} placeholder="代碼 (例: A-7)" className="px-3 py-2 text-xs rounded-xl border border-[#cbd5e1] outline-none w-28 uppercase font-bold" maxLength={4} />
              <select value={newShiftType} onChange={(e) => setNewShiftType(e.target.value)} className="px-3 py-2 text-xs rounded-xl border border-[#cbd5e1] outline-none font-bold">
               <option value="morning">歸類：早班</option><option value="evening">歸類：晚班</option><option value="full">歸類：全天</option><option value="off">歸類：休假</option>
              </select>
              <button onClick={addShiftRule} disabled={!newShiftCode.trim()} className="px-4 py-2 bg-[#2563eb] text-[#ffffff] text-xs font-bold rounded-xl active:scale-95 disabled:opacity-50 transition-colors shadow-sm flex items-center gap-1"><Icon name="plus" size={14} /> 新增班別</button>
            </div>

            <div className="mt-6 pt-4 border-t border-[#bfdbfe]">
              <h3 className="font-black text-[#1e40af] mb-3 flex items-center gap-2 text-sm"><Icon name="palette" size={16} /> 職位顏色自訂</h3>
              <div className="flex flex-wrap gap-2">
               {Array.from(new Set(staffList.map(s => s.title).filter(Boolean))).map(role => (
                 <div key={role} className="flex items-center bg-[#ffffff] py-1 pl-3 pr-2 rounded-xl shadow-sm border border-[#bfdbfe] text-xs font-bold gap-2">
                  <span className="text-[#334155] max-w-[80px] truncate" title={role}>{role}</span>
                  <input 
                    type="color" 
                    value={roleColors[role] || '#ffffff'} 
                    onChange={(e) => updateData({ roleColors: { ...(roleColors || {}), [role]: e.target.value } })}
                    className="w-6 h-6 p-0 border-0 rounded cursor-pointer bg-transparent"
                  />
                  {roleColors[role] && (
                    <button onClick={() => {
                     const newColors = {...roleColors};
                     delete newColors[role];
                     db.doc(getPublicPath(`schedules_data/branch_${currentBranch}`)).update({
                       roleColors: newColors
                     }).catch(() => {
                       updateData({ roleColors: newColors });
                     });
                    }} className="text-[#cbd5e1] hover:text-[#ef4444]"><Icon name="x" size={14} /></button>
                  )}
                 </div>
               ))}
               {Array.from(new Set(staffList.map(s => s.title).filter(Boolean))).length === 0 && <span className="text-xs text-[#64748b]">尚無職位，請先於下方班表新增人員。</span>}
              </div>
              <p className="text-[10px] text-[#3b82f6] mt-2">提示：點擊色塊可自訂該職位的背景顏色，未設定則使用系統自動配色。列印時也會自動套用！</p>
            </div>
           </div>
         )}

         <div className="bg-[#ffffff] rounded-[2rem] shadow-sm border border-slate-400 overflow-hidden mb-8">
           <div className="flex items-center justify-between p-4 bg-[#f8fafc] border-b border-slate-400">
            <button onClick={() => changeMonth(-1)} className="p-2 bg-[#ffffff] rounded-xl shadow-sm active:scale-90 transition-all text-[#475569] border border-[#cbd5e1]"><Icon name="chevron-left" size={18} /></button>
            <div className="font-black text-[#1e293b] flex items-center gap-2 text-xl"><Icon name="calendar" size={20} className="text-brand-red" /> {currentDate.getFullYear()} 年 {currentDate.getMonth() + 1} 月</div>
            <button onClick={() => changeMonth(1)} className="p-2 bg-[#ffffff] rounded-xl shadow-sm active:scale-90 transition-all text-[#475569] border border-[#cbd5e1]"><Icon name="chevron-right" size={18} /></button>
           </div>

           <div className="overflow-x-auto overflow-y-visible custom-scrollbar bg-[#ffffff] relative pb-2 w-full">
            <div ref={tableRef} className="w-max min-w-full bg-[#ffffff] relative">
              <table className="w-full border-collapse min-w-max text-xs select-none schedule-table">
               <thead>
                 <tr>
                  <th colSpan={3} className="bg-[#d1fae5] border border-[#64748b] p-2 text-lg font-black tracking-widest sticky left-0 top-0 z-[60] shadow-sm" style={{ height: '40px' }}>{currentDate.getMonth() + 1}月</th>
                  {daysInMonth.map(day => (
                    <th key={`date-${day.dateNum}`} className={`border border-[#64748b] p-1 text-center font-black text-base w-9 sticky top-0 z-[50] shadow-sm ${getHeaderBg(day.dateString, day.isWeekend)}`} style={{ height: '40px', borderLeft: isRedDay(day.dateString, day.isWeekend) ? '2px solid #f43f5e' : undefined }}>{day.dateNum}</th>
                  ))}
                 </tr>
                 <tr>
                  <th className="bg-[#10b981] border border-[#64748b] p-1 w-[76px] sticky left-0 z-[60] text-[#ffffff] font-black shadow-sm" style={{ top: '40px', height: '40px' }}>職稱</th>
                  <th className="bg-[#10b981] border border-[#64748b] p-1 w-[80px] sticky left-[76px] z-[60] text-[#ffffff] font-black shadow-sm" style={{ top: '40px', height: '40px' }}>姓名</th>
                  <th className="bg-[#10b981] border border-[#64748b] p-1 w-[40px] text-xs leading-tight sticky left-[156px] z-[60] text-[#ffffff] font-black shadow-sm" style={{ top: '40px', height: '40px' }}>休假<br/>天數</th>
                  {daysInMonth.map(day => (
                    <th key={`day-${day.dateNum}`} className={`border border-[#64748b] p-1 text-center sticky z-[50] shadow-sm font-bold text-sm ${getHeaderBg(day.dateString, day.isWeekend)}`} style={{ top: '40px', height: '40px' }}>{day.dayOfWeek}</th>
                  ))}
                 </tr>
                 <tr>
                  <th colSpan={3} className="bg-[#ffffff] border border-[#64748b] p-1 text-right text-xs text-[#94a3b8] font-bold sticky left-0 z-[60] shadow-sm" style={{ top: '80px', height: isDownloading ? '92px' : '60px' }}>{isManager && !isDownloading ? '特殊節日 (點擊設定) ➔' : '特殊節日 ➔'}</th>
                  {daysInMonth.map(day => {
                    const h = getHolidayData(day.dateString);
                    const isEditingHolidayCell = isManager && !isDownloading && selectedCell?.type === 'holiday' && selectedCell?.date === day.dateString;
                    return (
                     <th key={`holiday-${day.dateNum}`} onClick={(e) => { e.stopPropagation(); openHolidayEdit(day.dateString); }} className={`border border-[#64748b] p-0 text-center align-top relative sticky shadow-sm ${isEditingHolidayCell ? 'z-[200]' : 'z-[50]'} ${isManager && !isDownloading ? 'cursor-pointer hover:brightness-95' : ''} ${getCellBg(day.dateString, day.isWeekend)}`} style={{ top: '80px', height: isDownloading ? '92px' : '60px', minHeight: isDownloading ? '92px' : '60px', zIndex: isEditingHolidayCell ? 200 : 50 }}>
                       {isEditingHolidayCell ? (

 return (

     <p className="text-xs font-bold text-slate-300 leading-relaxed">{"\u96FB\u8166\u7248\u9700\u81F3\u5C11 430 x 720 \u624D\u80FD\u904A\u73A9\uFF0C\u907F\u514D\u7E2E\u5C0F\u756B\u9762\u5F71\u97FF\u96E3\u5EA6\u3002"}</p>

   <iframe
    srcDoc={foodResearchHTML}
    className="fr-game-frame"
    style={{width:'100%',height:'100%',border:'none',display:'block'}}
    sandbox="allow-scripts allow-same-origin"
    onLoad={() => {
     const visHandler = () => {
     const iframe = document.querySelector('iframe[sandbox]');
     if(iframe && iframe.contentWindow){
      iframe.contentWindow.postMessage({type: document.hidden ? 'PAUSE_GAME' : 'RESUME_GAME'},'*');
     }
     };
     document.addEventListener('visibilitychange', visHandler);
     const foodResearchProgressPatch = progress => {
      const p = progress && typeof progress === 'object' ? progress : {};
      return {
       runScore:Math.max(0,Math.round(Number(p.score)||0)),
       stageBestScores:p.stageBestScores && typeof p.stageBestScores === 'object' ? p.stageBestScores : {},
       creditedStages:Array.isArray(p.creditedStages) ? p.creditedStages.map(Number).filter(Number.isFinite) : [],
        uniqueBossStages:Array.isArray(p.uniqueBossStages) ? p.uniqueBossStages.map(Number).filter(Number.isFinite) : [],
        maxStage:Math.max(1,Math.min(22,Math.round(Number(p.maxStage)||1))),
        resumeStage:Math.max(1,Math.min(22,Math.round(Number(p.resumeStage||p.currentStage||p.stage||p.maxStage)||1))),
        resumeStageUpdatedAt:Math.max(0,Number(p.resumeStageUpdatedAt)||Date.now()),
        scoreLegacyBase:Math.max(0,Math.round(Number(p.scoreLegacyBase)||0)),
        scoreCatchupFloor:Math.max(0,Math.round(Number(p.scoreCatchupFloor)||0)),
       scoreRulesVersion:'fr-stage-best-v2',
       finalClearAwarded:!!p.finalClearAwarded
      };
     };
     const handler = msg => {
     if (!msg.data) return;
     if (msg.data.type === 'FR_STAGE_SCORE_UPDATE') {
      if (!frTestModeRef.current && frRunModeRef.current!=='patrol') writeSave(foodResearchProgressPatch(msg.data.progress));
      return;
     }
     if (msg.data.type === 'FR_BACK_TO_CAMP') {
       const wasTestMode = frTestModeRef.current;
       const testedStage = frTestStageRef.current;
       const wasBossDuel = frBossDuelRef.current;
       const completedRunMode = frRunModeRef.current;
       const testedBossName = (window.FOOD_RESEARCH_BOSSES || []).find(item=>item.id===frTestBossIdRef.current)?.name || 'BOSS';
       if (!wasTestMode && completedRunMode==='patrol') {
        const cur = loadSave();
        writeSave({gold:(cur.gold||0)+(msg.data.gold||0)});
        triggerNotify('世界巡遊完成：已帶回 '+Math.max(0,Number(msg.data.gold)||0)+' 金幣，排行榜分數與主線進度不變。','success');
       } else if (!wasTestMode) {
        const cur = loadSave();
        const progressPatch = foodResearchProgressPatch(msg.data.progress || {score:msg.data.score,maxStage:msg.data.maxStage});
        const finalScore = Math.max(0, Number(progressPatch.runScore)||0);
        writeSave({
         ...progressPatch,
         gold: (cur.gold || 0) + (msg.data.gold || 0),
         lastScore: finalScore,
         bestScore: Math.max(Number(cur.bestScore)||0, finalScore),
         runScore: finalScore
        });
        if (finalScore > 0) {
         syncFoodResearchRanking({
          score:finalScore,
          stage:msg.data.maxStage || progressPatch.maxStage || msg.data.stage,
          bossKills:msg.data.bossKills,
          durationMs:msg.data.durationMs,
          completed:msg.data.completed,
          runId:msg.data.runId
         }).catch(error => console.error('同步食研所排行榜失敗', error));
        }
       } else {
        triggerNotify(wasBossDuel?(testedBossName+'單挑演練結束，測試結果未計入正式紀錄。'):('第 '+testedStage+' 關演練結束，測試結果未計入正式紀錄。'),'success');
       }
      window.removeEventListener('message', handler);
      foodResearchHTMLRef.current='';
      frTestModeRef.current=false;
      frTestStageRef.current=22;
      frBossDuelRef.current=false;
      frTestBossIdRef.current='';
      frTestThunderPhaseRef.current=0;
      frRunModeRef.current='main';
      frWorldMapIdxRef.current=null;
      setFrPhase('camp');
      return;
     }
     if (msg.data.type === 'FR_RIVAL_WIN') {
      if (frTestModeRef.current) return;
      const today = new Date().toDateString();
      const rivalNames = msg.data.rivalNames || [];
      const rivalPhones = msg.data.rivalPhones || [];
      const myName = currentUser?.name || '玩家';
      // 單名入侵者的落敗已由 FR_RIVAL_ONE_DOWN 記錄，這裡只結算玩家獎勵。
      db.collection(getPublicPath(`warlog_${currentUser?.phone||'guest'}`)).add({
       type:'rival_win',
       target: rivalNames.join('、') || (window._lastRivalPool||[]).map(r=>r.name).join('、') || '對手',
       coins: 30, timestamp: Date.now(), date: today, claimed: false
      }).catch(()=>{});
     }
     if (msg.data.type === 'FR_RIVAL_ONE_DOWN') {
      if (frTestModeRef.current) return;
      const rp = msg.data.rivalPhone;
      const rn = msg.data.rivalName || '對手';
      const myName = currentUser?.name || '玩家';
      if(rp) {
       db.collection(getPublicPath(`warlog_${rp}`)).add({
        type:'rival_lose_entry', by: myName,
        rivalName: rn,
        coins: 0, timestamp: Date.now(), date: new Date().toDateString(), claimed: true
       }).catch(()=>{});
      }
     }
     if (msg.data.type === 'FR_GOLD_UPDATE') { /* 本場金幣回營時統一結算 */ }
     if (msg.data.type === 'FR_QUEST_KILL') {
      if (frTestModeRef.current) return;
      const killCount = Math.max(0, Math.min(50, Number(msg.data.count)||0));
      const s2 = loadSave(); const q2 = s2.quests;
      if (q2 && !q2.tasks[0].done && killCount > 0) {
       q2.tasks[0].progress = Math.min(q2.tasks[0].target, (q2.tasks[0].progress||0)+killCount);
       writeSave({ quests: q2 }, { sync: msg.data.flush === true });
      } else if (msg.data.flush === true) {
       syncFoodResearchSave(s2);
      }
     }
     if (msg.data.type === 'FR_RIVAL_PLAYER_LOST') {
      if (frTestModeRef.current) return;
      const today = new Date().toDateString();
      const rivalPhones = msg.data.rivalPhones || [];
      const rivalNames = msg.data.rivalNames || [];
      const myName = currentUser?.name || '玩家';
      db.collection(getPublicPath(`warlog_${currentUser?.phone||'guest'}`)).add({
       type:'rival_lose', target:rivalNames.join('、')||'入侵者', coins:0,
       timestamp:Date.now(), date:today, claimed:true
      }).catch(()=>{});
      rivalPhones.forEach((phone,index) => {
       if(!phone) return;
       db.collection(getPublicPath(`warlog_${phone}`)).add({
        type:'rival_win', target:myName, rivalName:rivalNames[index]||'入侵者', coins:15,
        timestamp:Date.now(), date:today, claimed:false
       }).catch(()=>{});
      });
     }
     if (msg.data.type === 'FR_PENALTY_RETURN') {
      if (frTestModeRef.current) {
       window.removeEventListener('message', handler);
       foodResearchHTMLRef.current='';
       frTestModeRef.current=false;
       frTestStageRef.current=22;
       frBossDuelRef.current=false;
       frTestBossIdRef.current='';
       frTestThunderPhaseRef.current=0;
       triggerNotify('演練已結束，裝備與正式紀錄不受影響。','info');
       setFrPhase('camp');
       return;
      }
      if (frRunModeRef.current==='patrol') {
       window.removeEventListener('message', handler);
       foodResearchHTMLRef.current='';
       frRunModeRef.current='main';frWorldMapIdxRef.current=null;
       triggerNotify('世界巡遊失敗：本場金幣未帶回，主線進度與裝備不受影響。','warning');
       setFrPhase('camp');
       return;
      }
      const pen = msg.data.penalty || {};
      const cur = loadSave();
      const walletBefore = Math.max(0, Number(cur.gold)||0);
      const penaltyRate = Math.max(0, Math.min(.2, Number(pen.walletRate)||.2));
      const walletFee = Math.round(walletBefore * penaltyRate);
      const progressPatch = foodResearchProgressPatch(msg.data.progress || {score:msg.data.score,maxStage:msg.data.maxStage});
      writeSave({ ...progressPatch, gold:Math.max(0, walletBefore-walletFee) });
      const failure=msg.data.failure||{},rollbackText=failure.rolledBack?('，關卡已由第 '+failure.failedStage+' 關退回第 '+failure.rollbackStage+' 關'):'';
      triggerNotify('遠征失敗：本關未完成分數不計，另支付 '+walletFee+' 金幣'+rollbackText+'。武器與護符已保留。','warning');
      window.removeEventListener('message', handler);
      foodResearchHTMLRef.current='';
      frTestStageRef.current=22;
      frBossDuelRef.current=false;
      frTestBossIdRef.current='';
      frTestThunderPhaseRef.current=0;
      frRunModeRef.current='main';frWorldMapIdxRef.current=null;
      setFrPhase('camp');
     }
     if (msg.data.type === 'FOOD_RESEARCH_BACK') {
      window.removeEventListener('message', handler);
      foodResearchHTMLRef.current='';
      frTestStageRef.current=22;
      frTestModeRef.current=false;
      frBossDuelRef.current=false;
      frTestBossIdRef.current='';
      frTestThunderPhaseRef.current=0;
      setSelectedActivity(null);
     }
     };
     window.addEventListener('message', handler);
    }}
   />
  </div>
 );
}
