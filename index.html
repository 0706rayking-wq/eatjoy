    const App = () => {
     const [currentPage, setCurrentPage] = useState('auth');
     const [showThemeModal, setShowThemeModal] = useState(false);
     const [activeTheme, setActiveTheme] = useState(() => localStorage.getItem('k_app_theme') || 'red');

         useEffect(() => {
            const themeObj = APP_THEMES.find(t => t.id === activeTheme) || APP_THEMES[0];
            const root = document.documentElement;
            const [r,g,b] = (themeObj.color || '185 18 27').split(' ');
            root.style.setProperty('--brand-red', themeObj.color || '185 18 27');
            root.style.setProperty('--app-bg', themeObj.bgHex || '#f8fafc');
            root.style.setProperty('--accent', `rgb(${r},${g},${b})`);
            root.style.setProperty('--accent-10', `rgba(${r},${g},${b},0.15)`);
            root.style.setProperty('--accent-20', `rgba(${r},${g},${b},0.25)`);
            root.style.setProperty('--accent-30', `rgba(${r},${g},${b},0.40)`);
            if (themeObj.vars && Object.keys(themeObj.vars).length > 0) {
               Object.entries(themeObj.vars).forEach(([k,v]) => root.style.setProperty(k, v));
            } else {
               const reset = {
                  '--leather-deep': themeObj.bgHex || '#f8fafc',
                  '--leather-base': themeObj.bgHex || '#f8fafc',
                  '--leather-mid': '#ffffff',
                  '--leather-light': '#f8fafc',
                  '--leather-lift': '#f1f5f9',
                  '--leather-hover': '#e2e8f0',
                  '--gold-bright': themeObj.hex || '#b9121b',
                  '--gold-mid': themeObj.hex || '#b9121b',
                  '--gold-dim': themeObj.hex || '#b9121b',
                  '--gold-shadow': themeObj.hex || '#b9121b',
                  '--gold-glow': `rgba(${r},${g},${b},0.2)`,
                  '--gold-subtle': `rgba(${r},${g},${b},0.08)`,
                  '--gold-border': `rgba(${r},${g},${b},0.25)`,
                  '--t1': '#1e293b', '--t2': '#475569',
                  '--t3': '#94a3b8', '--t4': '#cbd5e1',
                  '--gold-gradient': `linear-gradient(135deg,${themeObj.hex},${themeObj.hex})`,
                  '--gold-gradient-h': `linear-gradient(90deg,${themeObj.hex},${themeObj.hex})`,
               };
               Object.entries(reset).forEach(([k,v]) => root.style.setProperty(k, v));
            }
            document.body.className = document.body.className.replace(/theme-\S+/g,'').trim();
            document.body.classList.add('theme-' + themeObj.id);
            // 判斷是否為深色主題（--leather-deep 的亮度低於閾值）
            // 以背景亮度判斷深色主題，避免淺色主題因自訂文字色被錯套深色樣式。
            const hexToLuma = (hex = '#ffffff') => {
               const clean = String(hex).replace('#', '').trim();
               const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
               const n = parseInt(full.slice(0, 6), 16);
               if (Number.isNaN(n)) return 255;
               const rr = (n >> 16) & 255, gg = (n >> 8) & 255, bb = n & 255;
               return (0.2126 * rr) + (0.7152 * gg) + (0.0722 * bb);
            };
            const themeSurface = themeObj.vars?.['--leather-base'] || themeObj.bgHex || '#ffffff';
            const isDark = themeObj.vars && hexToLuma(themeSurface) < 110;
            if (isDark) {
               document.body.classList.add('theme-dark');
            }
            localStorage.setItem('k_app_theme', activeTheme);
         }, [activeTheme]);
     const [currentUser, setCurrentUser] = useState(() => { const saved = localStorage.getItem('k_active_user'); return saved ? JSON.parse(saved) : null; });
     const [isSuperAdmin, setIsSuperAdmin] = useState(() => localStorage.getItem('k_super_admin') === 'true');
     const [isManager, setIsManager] = useState(() => {
      if (localStorage.getItem('k_super_admin') === 'true') return true;
      const saved = localStorage.getItem('k_active_user');
      if (saved) {
        try { return isSupervisorRole(JSON.parse(saved).role); } catch(e) {}
      }
      return false;
     });
     const [fbReady, setFbReady] = useState(false);
     const [user, setUser] = useState(null);
     const [notifications, setNotifications] = useState([]); // 通知系統
     const [users, setUsers] = useState([]);

     const [activeAnnouncement, setActiveAnnouncement] = useState(null);
     
     const [globalBranches, setGlobalBranches] = useState(['南港Lalaport']);
     const [currentBranch, setCurrentBranch] = useState('南港Lalaport');
     const [branchZones, setBranchZones] = useState([]);
     const [announcements, setAnnouncements] = useState([]);
     const [tickerText, setTickerText] = useState('');
      const [gameConfig, setGameConfig] = useState({
       isOpen: false,
       bossName: "被感染的小雷神",
       bossImg: null,
       questions: FOOD_RESEARCH_QUESTIONS,
       questionBankVersion: FOOD_RESEARCH_QUESTION_BANK_VERSION
      });
     const [menuData, setMenuData] = useState({});
     const [onboardingData, setOnboardingData] = useState({});
     const [benefitsData, setBenefitsData] = useState({});
     const [rulesData, setRulesData] = useState({});
     const [contentStatus, setContentStatus] = useState({});
     const [ingredientData, setIngredientData] = useState({});
     const [wasteReports, setWasteReports] = useState([]);
     const [globalRecipes, setGlobalRecipes] = useState([]);
     
     const [completedZones, setCompletedZones] = useState([]);
     const [standards, setStandards] = useState({});
     const [signatures, setSignatures] = useState([]);
     const [onboardingChecklistProgress, setOnboardingChecklistProgress] = useState({});
     const [myHygieneTraining, setMyHygieneTraining] = useState({});
     const [myOccupationalSafetyTraining, setMyOccupationalSafetyTraining] = useState({});

     const logout = () => { 
      setCurrentUser(null); setIsManager(false); setIsSuperAdmin(false); setCurrentPage('auth'); 
      localStorage.removeItem('k_active_user'); 
      localStorage.removeItem('k_super_admin');
     };
     const triggerNotify = useCallback((msg, type = "info") => {
      const id = Date.now(); setNotifications(prev => [...prev, { id, msg, type }]);
      setTimeout(() => setNotifications(prev => prev.filter(n => n.id !== id)), 4000);
     }, []);

     const openAnnouncement = (a) => {
      setActiveAnnouncement(a);
      const readBy = a.readBy || [];
      if (currentUser && !readBy.includes(currentUser.name)) {
        const newReadBy = [...readBy, currentUser.name];
        
        db.collection(getPublicPath(`announcements/branch_${currentBranch}/items`)).doc(String(a.id)).set({ readBy: newReadBy }, { merge: true });
        
        db.doc(getPublicPath(`announcements/branch_${currentBranch}`)).get().then(doc => {
         if(doc.exists && doc.data().items) {
           const items = doc.data().items;
           const idx = items.findIndex(i => String(i.id) === String(a.id));
           if(idx > -1) {
            items[idx].readBy = newReadBy;
            db.doc(getPublicPath(`announcements/branch_${currentBranch}`)).set({ items });
           }
         }
        });
      }
     };

     const getReaderId = useCallback(() => currentUser?.phone || currentUser?.name || '', [currentUser]);

     const isContentUnread = useCallback((key) => {
      const readerId = getReaderId();
      const item = contentStatus?.[key] || {};
      return !!(readerId && item.publishedAt && !(item.readBy || []).includes(readerId));
     }, [contentStatus, getReaderId]);

     const markContentRead = useCallback((key) => {
      const readerId = getReaderId();
      if (!readerId || !currentBranch) return;
      db.doc(getPublicPath(`content_status/branch_${currentBranch}`)).set({
        [key]: { readBy: firebase.firestore.FieldValue.arrayUnion(readerId) }
      }, { merge: true }).catch(() => {});
     }, [currentBranch, getReaderId]);

     const publishContent = useCallback(async (key, title, targetBranches = [currentBranch]) => {
      const now = Date.now();
      const branches = targetBranches && targetBranches.length > 0 ? targetBranches : [currentBranch];
      try {
        await Promise.all(branches.map(branch => (
         db.doc(getPublicPath(`content_status/branch_${branch}`)).set({
          [key]: {
           title,
           publishedAt: now,
           readBy: []
          }
         }, { merge: true })
        )));
        triggerNotify("更新發布成功，員工首頁會顯示提醒紅點", "success");
      } catch (e) {
        triggerNotify("更新發布失敗", "error");
      }
     }, [currentBranch, triggerNotify]);

     useEffect(() => {
     const pageToContentKey = { menu: 'menu', schedule: 'schedule', kitchenReport: 'kitchenReport' };
     const key = pageToContentKey[currentPage];
     if (key && isContentUnread(key)) markContentRead(key);
     if (currentPage === 'kitchenReport' && isContentUnread('monthlyAssembly')) markContentRead('monthlyAssembly');
     }, [currentPage, contentStatus, isContentUnread, markContentRead]);

     useEffect(() => {
      if (!currentUser || !currentBranch) return;

      let intervalId;
      const randomDelay = Math.floor(Math.random() * 15000);

      const checkCronTasks = async () => {
        try {
         const now = new Date();
         const h = now.getHours();

         const branchesToCheck = isSuperAdmin ? globalBranches : [currentBranch];

         for (const branch of branchesToCheck) {
           const cronRef = db.doc(getPublicPath(`system/cron_${branch}`));
           const docSnap = await cronRef.get();
           const data = docSnap.exists ? docSnap.data() : {};

           let targetResetDate = new Date(now);
           if (h < INSPECTION_RESET_HOUR) targetResetDate.setDate(targetResetDate.getDate() - 1);
           const targetResetStr = formatDateKey(targetResetDate);

           if (data.lastReset !== targetResetStr) {
            const resetAt = Date.now();
            const progressRef = db.doc(getPublicPath(`system/progress_${branch}`));
            const progressSnap = await progressRef.get();
            const progressData = progressSnap.exists ? (progressSnap.data() || {}) : {};
            const progressBusinessDate = progressData.businessDate || getInspectionBusinessDate(progressData.updatedAt || progressData.resetAt || Date.now());
            const hasCurrentDayProgress = progressBusinessDate === targetResetStr;
            await cronRef.set({ lastReset: targetResetStr, lastResetAt: resetAt }, {merge: true});
            if (!hasCurrentDayProgress) {
             await progressRef.set({
              completedZones: [],
              integrityInvalidZones: [],
              businessDate: targetResetStr,
              resetAt,
              resetMode: 'auto'
             }, {merge: true});
             db.collection(getPublicPath(`daily_photo_resets_${branch}`)).add({
              branch,
              businessDate: targetResetStr,
              mode: 'auto',
              resetAt,
              resetBy: currentUser?.phone || '',
              resetByName: currentUser?.name || '系統排程',
              note: `${INSPECTION_RESET_LABEL} 自動切換營業日，只重置進度，不刪除巡視照`
             }).catch(err => console.warn("寫入巡視重置紀錄失敗", err));
            }
           }

           let targetAlertDate = new Date(now);
           if (h < 23) targetAlertDate.setDate(targetAlertDate.getDate() - 1);
           const targetAlertStr = formatDateKey(targetAlertDate);

           if (h >= 23 && data.lastMissingAlert !== targetAlertStr) {
            const progSnap = await db.doc(getPublicPath(`system/progress_${branch}`)).get();
            const progData = progSnap.exists ? (progSnap.data() || {}) : {};
            const progBusinessDate = progData.businessDate || getInspectionBusinessDate(progData.updatedAt || progData.resetAt || Date.now());
            const invalidZones = progData.integrityInvalidZones || [];
            const completed = progBusinessDate === targetAlertStr
             ? [...new Set(progData.completedZones || [])].filter(zoneId => !invalidZones.includes(zoneId))
             : [];

       batch.set(markerRef, {done:true, importedAt:Date.now(), category:'壽司', itemCount:items.length});
       await batch.commit();
      } catch (error) {
       console.warn('red shrimp sushi spec import skipped', error);
      }
     };
     importRedShrimpSushiSpecs();
    }, [user, currentBranch, isSuperAdmin, getPublicPath]);

    useEffect(() => {
     if (!user || !currentBranch || !isSuperAdmin) return;
     const importTamagoyakiSushiSpecs = async () => {
      const markerRef = db.doc(getPublicPath(`ingredients/spec_sushi_tamagoyaki_set_v13_${currentBranch}`));
      try {
       const marker = await markerRef.get();
       if (marker.exists) return;
       const ids = [
        'spec-sushi-seared-cheese-tamagoyaki',
        'spec-sushi-mentaiko-tamagoyaki',
        'spec-sushi-caramelized-tamagoyaki'
       ];
       const items = DEFAULT_INGREDIENT_SPECS.filter(spec => ids.includes(spec.id));
       const collectionRef = db.collection(getPublicPath(`ingredients/specs_${currentBranch}/items`));
       const existingDocs = await Promise.all(items.map(item => collectionRef.doc(item.id).get()));
       const batch = db.batch();
       items.forEach((item, index) => {
        if (!existingDocs[index].exists) batch.set(collectionRef.doc(item.id), {...item, timestamp:Date.now() + index, updateTime:Date.now()}, {merge:true});
       });
       batch.set(markerRef, {done:true, importedAt:Date.now(), category:'壽司', itemCount:items.length});
       await batch.commit();
      } catch (error) {
       console.warn('tamagoyaki sushi spec import skipped', error);
      }
     };
     importTamagoyakiSushiSpecs();
    }, [user, currentBranch, isSuperAdmin, getPublicPath]);

     useEffect(() => {
      if (!user) return;
      const branches = globalBranches && globalBranches.length ? globalBranches : [currentBranch].filter(Boolean);
      const reportsByBranch = new Map();
      const syncReports = () => {
       const merged = Array.from(reportsByBranch.values()).flat().sort((a,b)=>(b.timestamp || 0) - (a.timestamp || 0));
       setWasteReports(merged);
      };
      const unsubs = branches.map(branch => db.collection(getPublicPath(`ingredient_waste_${branch}`)).onSnapshot(s => {
       reportsByBranch.set(branch, s.docs.map(d => ({ ...d.data(), id: d.id, branch: d.data().branch || branch })));
       syncReports();
      }, () => {
       reportsByBranch.set(branch, []);
       syncReports();
      }));
      return () => unsubs.forEach(un => un());
     }, [user, currentBranch, globalBranches]);

     useEffect(() => {
      if (!user || !currentUser?.phone || !currentBranch) {
        setOnboardingChecklistProgress({});
        setMyHygieneTraining({});
        setMyOccupationalSafetyTraining({});
        return;
      }
      const year = getHygieneYear();
      const unsubChecklist = db.collection(getPublicPath(`onboarding_checklists_${currentBranch}`)).doc(currentUser.phone).onSnapshot(d => {
        setOnboardingChecklistProgress(d.exists ? d.data() : {});
      }, () => setOnboardingChecklistProgress({}));
      const unsubHygiene = db.collection(getPublicPath(`hygiene_training_${currentBranch}`)).doc(`${currentUser.phone}_${year}`).onSnapshot(d => {
        setMyHygieneTraining(d.exists ? d.data() : {});
      }, () => setMyHygieneTraining({}));
      const unsubOccupationalSafety = db.collection(getPublicPath(`occupational_safety_training_${currentBranch}`)).doc(`${currentUser.phone}_${year}`).onSnapshot(d => {
        setMyOccupationalSafetyTraining(d.exists ? d.data() : {});
      }, () => setMyOccupationalSafetyTraining({}));
      return () => {
        unsubChecklist();
        unsubHygiene();
        unsubOccupationalSafety();
      };
     }, [user, currentUser?.phone, currentBranch]);

     useEffect(() => {
      if (!isSuperAdmin && currentUser && currentUser.branch) {
        const allowedBranches = Array.isArray(currentUser.branch) ? currentUser.branch : [currentUser.branch];
        if (!allowedBranches.includes(currentBranch)) {
         setCurrentBranch(allowedBranches[0]);
        }
      }
     }, [currentUser, isSuperAdmin, currentBranch]);

     const canAccessBusinessManagement = isSuperAdmin || isSupervisorRole(currentUser?.role);

     const renderPage = () => {
      const onboardingListIds = (onboardingData?.list || []).map((item, idx) => getOnboardingItemId(item, idx));
      const onboardingCheckedIds = onboardingChecklistProgress?.year === getHygieneYear() && Array.isArray(onboardingChecklistProgress?.checkedIds) ? onboardingChecklistProgress.checkedIds : [];
      const onboardingDoneCount = onboardingListIds.filter(id => onboardingCheckedIds.includes(id)).length;
      const onboardingPrepIncomplete = onboardingListIds.length > 0 && onboardingDoneCount < onboardingListIds.length;
      const hygieneRequired = HYGIENE_REQUIRED_ROLES.includes(normalizeRole(currentUser?.role));
      const hygieneIncomplete = hygieneRequired && !(myHygieneTraining?.status === 'completed' && myHygieneTraining?.year === getHygieneYear());
      const occupationalSafetyIncomplete = hygieneRequired && !(myOccupationalSafetyTraining?.status === 'completed' && myOccupationalSafetyTraining?.year === getHygieneYear());
      switch(currentPage) {
        case 'home': {
         const progressPercent = branchZones.length > 0 ? Math.round((completedZones.length / branchZones.length) * 100) : 0;
         const hasUnsignedRules = !!(currentUser?.phone && RULE_CATEGORIES.some(cat => !signatures.some(s => s.category === `守則簽署 - ${cat}` && s.phone === currentUser.phone)));
         return (
           <div className="home-page page-enter pb-10">
            <Ticker text={tickerText} />
            <div className="p-4 space-y-6 mt-2 text-left font-bold">
              
{/* 支援最高權限與多店主管：首頁快速切換分店 */}
              {(isSuperAdmin || (Array.isArray(currentUser?.branch) && currentUser.branch.length > 1)) && (
               <div className="home-selector-card glass-panel text-white p-5 rounded-[2rem] flex items-center justify-between shadow-xl mb-2 bg-slate-900 border">
                 <div className="relative z-[1] min-w-0">
                  <p className="text-[10px] uppercase tracking-widest text-slate-400 mb-1">目前檢視分店</p>
                  <select 
                    value={currentBranch} 
                    onChange={e => setCurrentBranch(e.target.value)} 
                    className="bg-transparent border-none text-xl font-black outline-none appearance-none cursor-pointer text-white max-w-[240px] truncate"
                  >
                    {(isSuperAdmin ? globalBranches : currentUser.branch).map(b => (
                     <option key={b} value={b} className="text-slate-900">{b}</option>
                    ))}
                  </select>
                 </div>
                 <div className="relative z-[1] bg-brand-red w-11 h-11 rounded-2xl flex items-center justify-center shadow-lg shrink-0">
                  <Icon name="building-2" size={20} className="text-white"/>
                 </div>
               </div>
              )}

              <div onClick={() => setCurrentPage('inspection')} className="inspection-summary-card glass-panel p-6 pl-7 rounded-[2rem] border bg-white shadow-sm active-scale cursor-pointer">
               <div className="relative z-[1] flex justify-between items-center gap-4 mb-5 px-1">
                <div className="min-w-0">
                 <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-2">巡視進度 ({INSPECTION_RESET_LABEL}切換營業日)</p>
                 <h3 className="text-lg font-black text-slate-800 leading-tight">{completedZones.length >= branchZones.length && branchZones.length > 0 ? "全數巡視完成" : `進度：${completedZones.length} / ${branchZones.length || 1}`}</h3>
                </div>
                <div className="inspection-progress-ring shrink-0" style={{"--progress": `${progressPercent}%`}}>
                 <span className="text-[11px] font-black text-brand-red">{progressPercent}%</span>
                </div>
               </div>
               <div className="relative z-[1] bg-slate-100 h-3.5 rounded-full overflow-hidden border shadow-inner"><div className="h-full bg-brand-red opacity-80 transition-all duration-700" style={{ width: `${progressPercent}%` }}></div></div>
              </div>
              
              {/* 最新公告區塊 */}
              <div className="space-y-3">
               <h3 className="text-lg font-black tracking-tight flex items-center gap-2 mb-2" style={{color:'var(--t1,#1e293b)'}}><Icon name="bell" size={20} className="text-brand-red" /> {currentBranch} 最新公告</h3>
               {announcements.length > 0 ? announcements.slice(0, 3).map(a => {
                 const isRead = currentUser?.name ? a.readBy?.includes(currentUser.name) : false;
                 return (
                  <div key={a.id} onClick={() => openAnnouncement(a)}
                    className="glass-panel p-4 rounded-2xl border cursor-pointer active:scale-[0.98] transition-all flex gap-4"
                    style={{
                      background: isRead ? 'var(--leather-base,#f8fafc)' : 'linear-gradient(145deg,var(--leather-light,#fff),var(--leather-mid,#fff))',
                      borderColor: isRead ? 'var(--gold-border,rgba(0,0,0,0.1))' : 'var(--gold-bright,#b9121b)',
                      opacity: isRead ? 0.75 : 1,

                     <h4 className="font-black truncate" style={{color: isRead ? 'var(--t2,#475569)' : 'var(--t1,#1e293b)'}}>{a.title}</h4>
                     <p className="text-xs mt-1 line-clamp-1" style={{color:'var(--t3,#94a3b8)'}}>{a.content}</p>
                    </div>
                    <div className="text-[10px] whitespace-nowrap pt-1" style={{color:'var(--t3,#94a3b8)'}}>
                     {new Date(a.timestamp).toLocaleDateString()}
                    </div>
                  </div>
                 )
               }) : <div className="text-center py-6 text-xs font-bold glass-panel rounded-2xl border border-dashed shadow-sm" style={{color:'var(--t3,#94a3b8)',borderColor:'var(--gold-border)'}}>目前無新公告</div>}
              </div>

              <section className="grid grid-cols-2 gap-4">
               <NavCard title="叫貨系統" onClick={() => setCurrentPage('ordering')} colorClass="bg-rose-50/80" iconName="package-plus" />
               <NavCard title="員工守則" onClick={() => setCurrentPage('unifiedRules')} colorClass="bg-emerald-50/50" iconName="book-open" unread={hasUnsignedRules} />
               <NavCard title="每月班表" onClick={() => setCurrentPage('schedule')} colorClass="bg-indigo-50/50" iconName="calendar" unread={isContentUnread('schedule')} />
               <NavCard title="入職相關" onClick={() => setCurrentPage('onboarding')} colorClass="bg-blue-50/50" iconName="user-plus" unread={onboardingPrepIncomplete || hygieneIncomplete || occupationalSafetyIncomplete} />
               <NavCard title="廚房月報" onClick={() => setCurrentPage('kitchenReport')} colorClass="bg-rose-50/50" iconName="presentation" unread={isContentUnread('kitchenReport') || isContentUnread('monthlyAssembly')} />
               <NavCard title="本季菜單" onClick={() => setCurrentPage('menu')} colorClass="bg-yellow-50/50" iconName="utensils" unread={isContentUnread('menu')} />
               <NavCard title="限時活動" onClick={() => setCurrentPage('game-center')} colorClass="bg-amber-50/50" iconName="gamepad-2" />
               <NavCard title="經營管理" onClick={() => setCurrentPage('ingredients')} colorClass="bg-rose-50/50" iconName="briefcase-business" />
              </section>
            </div>
           </div>
         );
        }
        case 'ordering': return <OrderingSystem onBack={()=>setCurrentPage('home')} triggerNotify={triggerNotify} globalBranches={globalBranches} currentBranch={currentBranch} isSuperAdmin={isSuperAdmin} getPublicPath={getPublicPath} />;
        case 'inspection': return <InspectionPage onBack={()=>setCurrentPage('home')} standards={standards} completedZones={completedZones} triggerNotify={triggerNotify} branchZones={branchZones} currentBranch={currentBranch} getPublicPath={getPublicPath} currentUser={currentUser} isManager={isManager} isSuperAdmin={isSuperAdmin} />;
        case 'unifiedRules': return <UnifiedRulesPage rulesData={rulesData} onBack={()=>setCurrentPage('home')} user={currentUser} currentBranch={currentBranch} triggerNotify={triggerNotify} getPublicPath={getPublicPath} signatures={signatures} />;
        case 'menu': return <MenuDisplayPage onBack={()=>setCurrentPage('home')} items={menuData?.items} />;
        case 'kitchenReport': return <MonthlyReportPage onBack={()=>setCurrentPage('home')} report={contentStatus?.kitchenReport || {}} assemblyReport={contentStatus?.monthlyAssembly || {}} />;
        case 'game-center': return <GameCenter onBack={()=>setCurrentPage('home')} config={gameConfig} currentBranch={currentBranch} currentUser={currentUser} getPublicPath={getPublicPath} triggerNotify={triggerNotify} allUsers={users} globalBranches={globalBranches} isSuperAdmin={isSuperAdmin} />;
        case 'schedule': return <ScheduleSystem onBack={()=>setCurrentPage('home')} currentBranch={currentBranch} isManager={isManager || isSuperAdmin} getPublicPath={getPublicPath} triggerNotify={triggerNotify} publishContent={publishContent} />;
        case 'onboarding': return (
         <div className="p-4 space-y-4 page-enter text-left">
           <BackButton onClick={()=>setCurrentPage('home')} title="入職相關" />
           <SectionItem title="員工準備清單" iconName="list-checks" onClick={()=>setCurrentPage('onboard-list')} unread={onboardingPrepIncomplete} />
           <SectionItem title="每年度衛生講習" iconName="shield-check" onClick={()=>setCurrentPage('hygiene-training')} unread={hygieneIncomplete} />
           <SectionItem title="每年度職安講習" iconName="hard-hat" onClick={()=>setCurrentPage('occupational-safety-training')} unread={occupationalSafetyIncomplete} />
           <SectionItem title="停車資訊指引" iconName="car" onClick={()=>setCurrentPage('onboard-parking')} />
           <SectionItem title="上班動線引導" iconName="navigation" onClick={()=>setCurrentPage('workRoute')} />
           <SectionItem title="服裝儀容規定" iconName="shirt" onClick={()=>setCurrentPage('uniform-guidelines')} />
           <SectionItem title="考核加給標準" iconName="coins" onClick={()=>setCurrentPage('benefit-eval')} />
           <SectionItem title="員工相關福利" iconName="heart" onClick={()=>setCurrentPage('benefit-wel')} />
         </div>
        );
        case 'onboard-list': return <OnboardingChecklistPage onBack={()=>setCurrentPage('onboarding')} list={onboardingData?.list} currentUser={currentUser} currentBranch={currentBranch} getPublicPath={getPublicPath} triggerNotify={triggerNotify} />;
        case 'hygiene-training': return <HygieneTrainingPage onBack={()=>setCurrentPage('onboarding')} currentUser={currentUser} currentBranch={currentBranch} getPublicPath={getPublicPath} triggerNotify={triggerNotify} config={TRAINING_CONFIGS.hygiene} />;
        case 'occupational-safety-training': return <HygieneTrainingPage onBack={()=>setCurrentPage('onboarding')} currentUser={currentUser} currentBranch={currentBranch} getPublicPath={getPublicPath} triggerNotify={triggerNotify} config={TRAINING_CONFIGS.occupationalSafety} />;
        case 'onboard-parking': return <ListDetailPage onBack={()=>setCurrentPage('onboarding')} title="停車資訊" list={onboardingData?.parking} />;
        case 'workRoute': return (
         <div className="p-4 space-y-8 page-enter text-left pb-10 font-bold">
           <BackButton onClick={()=>setCurrentPage('onboarding')} title="上班動線" />
           <div className="space-y-4">
            {[{l:'大眾運輸引導',u:onboardingData?.routeBusUrl, icon:'bus'}, {l:'自行前往引導',u:onboardingData?.routeCarUrl, icon:'car'}].map(x => (
              <div key={x.l} onClick={() => x.u && window.open(x.u, '_blank')} className="glass-panel p-6 rounded-[2.5rem] bg-white border flex items-center justify-between active:bg-slate-50 cursor-pointer group transition-all">
               <div className="flex items-center gap-4">
                 <div className="w-12 h-12 bg-rose-50 text-brand-red rounded-2xl flex items-center justify-center shadow-inner"><Icon name={x.icon} size={22} /></div>
                 <div><p className="text-[10px] font-black text-slate-400 uppercase mb-1">Guide</p><h3 className="text-sm font-black text-slate-800">{x.l}</h3></div>
               </div>
               <Icon name="chevron-right" size={18} className="text-slate-300 group-active:text-brand-red" />
              </div>
            ))}
           </div>
         </div>
        );
        case 'uniform-guidelines': return <UniformGuidelinesPage onBack={()=>setCurrentPage('onboarding')} />;
        case 'benefit-eval': return <ListDetailPage onBack={()=>setCurrentPage('onboarding')} title="考核標準" list={benefitsData?.evaluation} />;
        case 'benefit-wel': return <ListDetailPage onBack={()=>setCurrentPage('onboarding')} title="福利項目" list={benefitsData?.welfare} />;
        case 'ingredients': return <IngredientManagementPage onBack={()=>setCurrentPage('home')} goSpecs={()=>setCurrentPage('ingredient-specs')} goWaste={()=>setCurrentPage('ingredient-waste')} goPeople={()=>setCurrentPage('people-management')} goPromotion={()=>setCurrentPage('promotion-path')} goDishCards={()=>setCurrentPage('dish-card-generator')} canManage={canAccessBusinessManagement} />;
        case 'ingredient-specs': return <IngredientSpecsPage onBack={()=>setCurrentPage('ingredients')} items={ingredientData?.specs || []} />;
        case 'dish-card-generator': return <DishCardGeneratorPage onBack={()=>setCurrentPage('ingredients')} triggerNotify={triggerNotify} />;
        case 'ingredient-waste': return canAccessBusinessManagement ? <IngredientWasteReportPage onBack={()=>setCurrentPage('ingredients')} currentBranch={currentBranch} currentUser={currentUser} getPublicPath={getPublicPath} triggerNotify={triggerNotify} reports={wasteReports} isSuperAdmin={isSuperAdmin} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'people-management': return canAccessBusinessManagement ? <PeopleManagementPage onBack={()=>setCurrentPage('ingredients')} goOnboarding={()=>setCurrentPage('people-onboarding-process')} goOffboarding={()=>setCurrentPage('people-offboarding')} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'people-onboarding-process': return canAccessBusinessManagement ? <PeopleOnboardingProcessPage onBack={()=>setCurrentPage('people-management')} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'people-offboarding': return canAccessBusinessManagement ? <PeopleOffboardingPage onBack={()=>setCurrentPage('people-management')} goVoluntary={()=>setCurrentPage('voluntary-offboarding-process')} goInvoluntary={()=>setCurrentPage('involuntary-offboarding-process')} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'voluntary-offboarding-process': return canAccessBusinessManagement ? <VoluntaryOffboardingProcessPage onBack={()=>setCurrentPage('people-offboarding')} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'involuntary-offboarding-process': return canAccessBusinessManagement ? <InvoluntaryOffboardingProcessPage onBack={()=>setCurrentPage('people-offboarding')} goProbation={()=>setCurrentPage('probation-evaluation-form')} goImprovement={()=>setCurrentPage('improvement-interview-form')} currentBranch={currentBranch} getPublicPath={getPublicPath} triggerNotify={triggerNotify} isSuperAdmin={isSuperAdmin} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'probation-evaluation-form': return canAccessBusinessManagement ? <ProbationEvaluationFormPage onBack={()=>setCurrentPage('involuntary-offboarding-process')} currentBranch={currentBranch} currentUser={currentUser} getPublicPath={getPublicPath} triggerNotify={triggerNotify} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'improvement-interview-form': return canAccessBusinessManagement ? <ImprovementInterviewFormPage onBack={()=>setCurrentPage('involuntary-offboarding-process')} currentBranch={currentBranch} currentUser={currentUser} getPublicPath={getPublicPath} triggerNotify={triggerNotify} /> : <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><BackButton onClick={()=>setCurrentPage('home')} title="返回首頁" /> 此區僅限最高權限、內場主管、外場主管使用</div>;
        case 'promotion-path': return <PromotionPathPage onBack={()=>setCurrentPage('ingredients')} isSuperAdmin={isSuperAdmin} getPublicPath={getPublicPath} triggerNotify={triggerNotify} />;
        case 'admin': return <AdminPage onBack={()=>setCurrentPage('home')} onLogout={logout} announcements={announcements} standards={standards} users={users} triggerNotify={triggerNotify} menu={menuData} onboarding={onboardingData} benefits={benefitsData} rulesData={rulesData} isSuperAdmin={isSuperAdmin} currentBranch={currentBranch} setCurrentBranch={setCurrentBranch} globalBranches={globalBranches} branchZones={branchZones} getPublicPath={getPublicPath} signatures={signatures} tickerText={tickerText} setTickerText={setTickerText} globalRecipes={globalRecipes} currentUser={currentUser} contentStatus={contentStatus} publishContent={publishContent} ingredientData={ingredientData} wasteReports={wasteReports} />;
        default: return <div className="p-20 text-center text-slate-400 font-black h-screen flex flex-col items-center justify-center gap-4"><Icon name="loader-2" className="animate-spin text-brand-red" size={32}/> 系統啟動中...</div>;
      }
     };

     return (
      <div className="min-h-screen flex flex-col" style={{overflowX:"hidden",width:"100%",maxWidth:"100vw"}}>
       {/* 通知 Toast */}
       <div style={{position:'fixed',top:'16px',right:'16px',left:'auto',zIndex:9999,display:'flex',flexDirection:'column',gap:'8px',pointerEvents:'none',maxWidth:'calc(100vw - 32px)'}}>
        {notifications.map(n=>(
         <div key={n.id} style={{
          background: n.type==='error'?'rgba(239,68,68,0.95)':n.type==='success'?'rgba(22,163,74,0.95)':n.type==='warning'?'rgba(234,179,8,0.95)':'rgba(59,130,246,0.95)',
          color:'#fff',padding:'10px 18px',borderRadius:'14px',fontSize:'13px',fontWeight:900,
          textShadow:'0 1px 2px rgba(0,0,0,0.4)',letterSpacing:'0.3px',
          boxShadow:'0 4px 16px rgba(0,0,0,0.18)',maxWidth:'260px',wordBreak:'break-all',
          animation:'fadeIn 0.2s ease',opacity:1
         }}>
          {n.type==='error'?'❌ ':n.type==='success'?'✅ ':n.type==='warning'?'⚠️ ':'ℹ️ '}{n.msg}
         </div>
        ))}
       </div>

        {currentPage !== 'auth' && (
         <header className="app-header p-3 sticky top-0 z-50 flex justify-between items-center bg-white/80 backdrop-blur-md border-b" style={{maxWidth:"100vw",overflow:"hidden"}}>
           <div className="flex items-center gap-3 cursor-pointer shrink-0" onClick={() => (isManager || currentUser?.status === 'approved') && setCurrentPage('home')}>
            <div className="app-logo-mark bg-brand-red w-11 h-11 rounded-2xl flex items-center justify-center text-white shadow-lg shrink-0 font-black text-xl leading-none">
              饗
            </div>
            <div>
              <span className="font-black text-xl text-slate-800 tracking-tighter leading-none block">EATJOY <span className="text-brand-red">OS</span></span>
              <span className="text-[9px] text-slate-400 font-bold uppercase">{currentBranch}</span>
            </div>
           </div>
           <div className="flex gap-2">
            {/* 新增的主題按鈕 */}
            <button onClick={() => setShowThemeModal(true)} className="h-10 min-w-10 flex items-center justify-center gap-1.5 px-3 rounded-2xl text-xs font-black bg-slate-100 text-slate-600 hover:text-brand-red active:scale-95 shadow-sm shrink-0 whitespace-nowrap" aria-label="切換主題">
              <Icon name="palette" size={16} />
            </button>
            <button onClick={() => isManager ? setCurrentPage('admin') : (currentUser?.status === 'approved' && setCurrentPage('home'))} className={`h-10 flex items-center gap-1.5 px-3.5 py-2 rounded-2xl text-xs font-black active:scale-95 shadow-sm shrink-0 whitespace-nowrap ${isSuperAdmin ? 'bg-brand-red text-white' : (isManager ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600')}`}>
              <Icon name={isManager ? "settings" : "bell"} size={16} />
              {isManager ? "後台" : "通知"}
            </button>
            {(currentUser || isManager) && (
              <button onClick={logout} className="h-10 flex items-center gap-1.5 px-3.5 py-2 rounded-2xl text-xs font-black bg-rose-50 text-brand-red border border-rose-100 active:scale-95 shadow-sm shrink-0 whitespace-nowrap">
               <Icon name="log-out" size={16} />
               登出
              </button>
            )}
           </div>
         </header>
        )}
        <main className={`flex-grow mx-auto w-full font-bold ${currentPage === 'schedule' ? 'max-w-[1600px] px-2' : 'max-w-lg'}`}>
         {!fbReady ? <div className="p-20 text-center h-screen flex flex-col items-center justify-center gap-4 font-bold"><Icon name="loader-2" className="animate-spin text-brand-red" size={48}/><p className="text-slate-400 font-black text-xs">連線中...</p></div>
         : (!isManager && !currentUser) ? <AuthPage users={users} setCurrentUser={setCurrentUser} setCurrentPage={setCurrentPage} setIsManager={setIsManager} setIsSuperAdmin={setIsSuperAdmin} setCurrentBranch={setCurrentBranch} globalBranches={globalBranches} triggerNotify={triggerNotify} getPublicPath={getPublicPath} />
         : (isManager || currentUser?.status === 'approved') ? renderPage() : (
           <div className="p-10 pt-32 text-center h-screen space-y-8 font-bold">
            <div className="bg-white w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-lg"><Icon name="clock" size={48} className="text-brand-red animate-pulse" /></div>
            <div className="space-y-2 text-center px-4"><h3 className="text-2xl font-black text-slate-800">授權等待中</h3><p className="text-slate-500 text-sm">註冊申請已提交。請聯繫您的主管進行核准。</p></div>
            <button onClick={logout} className="text-slate-400 font-bold border-b pb-1 text-sm">登出</button>
           </div>
         )}
         {/* 主題選擇彈跳視窗 */}
         {showThemeModal && (
           <div className="fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 page-enter" onClick={() => setShowThemeModal(false)}>
            <div className="bg-white rounded-[2.5rem] w-full max-w-sm shadow-2xl font-bold text-left flex flex-col" style={{maxHeight:'85vh'}} onClick={e => e.stopPropagation()}>
              {/* Header */}
              <div className="flex justify-between items-center px-6 pt-6 pb-4 shrink-0" style={{borderBottom:'1px solid var(--gold-border,rgba(255,255,255,0.1))'}}>
               <h2 className="text-base font-black text-slate-800 flex items-center gap-2">
                 <Icon name="sparkles" size={18} className="text-brand-red" />
                 介面風格選擇
               </h2>
               <button onClick={() => setShowThemeModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-400 hover:text-brand-red transition-colors active:scale-90"><Icon name="x" size={16} /></button>
              </div>

              {/* Theme grid — scrollable */}
              <div className="overflow-y-auto no-scrollbar px-5 py-4 flex-1">
               {/* Group labels */}
               {[
                 { label: '✨ 奢華系列', ids: ['crimson-gold','midnight-sapphire','obsidian-emerald','volcanic-amber','royal-violet'] },
                 { label: '⚡ 科技系列', ids: ['cyber-neon','matrix-green','titanium'] },
                 { label: '🌿 自然系列', ids: ['cherry-blossom','deep-ocean','forest-moss'] },
                 { label: '🕯️ 復古系列', ids: ['vintage-burgundy','antique-bronze','ink-indigo'] },
                 { label: '✦ 特殊系列', ids: ['rose-gold','arctic-white','sakura-white','lava-orange'] },
                 { label: '🎨 純色系列', ids: ['red','blue','emerald','orange','purple','rose','teal','indigo','slate','amber'] },
               ].map(group => (
                 <div key={group.label} className="mb-5">
                  <p className="text-[10px] font-black uppercase tracking-widest mb-2.5 px-1" style={{color:'var(--t3,#888)'}}>{group.label}</p>
                  <div className="grid grid-cols-1 gap-2">
                    {APP_THEMES.filter(t => group.ids.includes(t.id)).map(t => (
                     <button
                       key={t.id}
                       onClick={() => { setActiveTheme(t.id); triggerNotify(`已切換：${t.name}`, "success"); }}
                       className="relative flex items-center gap-3 p-3 rounded-2xl transition-all active:scale-[0.98] text-left overflow-hidden"
                       style={{
                        background: t.previewBg || (t.bgHex || '#f8fafc'),
                        border: activeTheme === t.id
                          ? `2px solid ${t.previewAccent || t.hex}`
                          : '2px solid rgba(0,0,0,0.08)',
                        boxShadow: activeTheme === t.id
                          ? `0 0 0 1px ${(t.previewAccent || t.hex)}40, 0 4px 12px rgba(0,0,0,0.15)`
                          : '0 2px 6px rgba(0,0,0,0.1)',
                       }}
                     >
                       {/* Color dot */}
                       <div className="shrink-0 w-9 h-9 rounded-xl flex items-center justify-center text-lg"
                        style={{background:`linear-gradient(135deg,${t.hex},${t.previewAccent})`,boxShadow:`0 2px 8px ${t.previewAccent}50`}}>
                        {t.emoji}
                       </div>
                       {/* Text */}
                       <div className="flex-1 min-w-0">
                        <div className="font-black text-sm leading-none mb-0.5" style={{color:'#fff',textShadow:'0 1px 4px rgba(0,0,0,0.6)'}}>{t.name}</div>
                        <div className="text-[10px] font-bold" style={{color:'rgba(255,255,255,0.55)'}}>{t.desc}</div>
                       </div>
                       {/* Active check */}
                       {activeTheme === t.id && (
                        <div className="shrink-0 w-6 h-6 rounded-full flex items-center justify-center"
                          style={{background:t.previewAccent,boxShadow:`0 2px 6px ${t.previewAccent}60`}}>
                          <Icon name="check" size={13} style={{color:'#000'}} />
                        </div>
                       )}
                       {/* Shimmer overlay for active */}
                       {activeTheme === t.id && (
                        <div className="absolute inset-0 rounded-2xl pointer-events-none"
                          style={{background:`linear-gradient(90deg,transparent,${t.previewAccent}15,transparent)`,animation:'shimmerSlide 2s ease-in-out infinite'}} />
                       )}
                     </button>
                    ))}
                  </div>
                 </div>
               ))}
              </div>

              {/* Footer */}
              <div className="px-5 pb-5 pt-3 shrink-0" style={{borderTop:'1px solid var(--gold-border,rgba(255,255,255,0.1))'}}>
               <button onClick={() => setShowThemeModal(false)} className="w-full bg-brand-red text-white font-black py-4 rounded-2xl active:scale-95 transition-all text-sm">
                 套用風格
               </button>
              </div>
            </div>
            <style>{`
              @keyframes shimmerSlide {
               0%   { transform: translateX(-100%); }
               100% { transform: translateX(100%); }
              }
            `}</style>
           </div>
         )}
         
         {/* 獨立公告彈出視窗 */}
         {activeAnnouncement && (
           <div className="fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 page-enter">
            <div className="rounded-[2.5rem] p-6 w-full max-w-sm shadow-2xl max-h-[85vh] overflow-y-auto font-bold text-left" style={{background:'linear-gradient(160deg,var(--leather-light,#fff),var(--leather-mid,#fff))',border:'1px solid var(--gold-border)'}}>
              <h2 className="text-xl font-black mb-2 leading-tight" style={{color:'var(--t1,#1e293b)'}}>{activeAnnouncement.title}</h2>
              <p className="text-[10px] mb-4 flex items-center gap-1" style={{color:'var(--t3,#94a3b8)'}}><Icon name="clock" size={12}/> {new Date(activeAnnouncement.timestamp).toLocaleString()}</p>
              {activeAnnouncement.img && <img src={activeAnnouncement.img} className="w-full rounded-2xl mb-5 object-cover border shadow-sm" alt="公告圖片" style={{borderColor:'var(--gold-border)'}} />}
              <p className="text-sm font-bold whitespace-pre-wrap leading-relaxed" style={{color:'var(--t2,#475569)'}}>{activeAnnouncement.content}</p>
              <button onClick={() => setActiveAnnouncement(null)} className="mt-8 w-full bg-brand-red text-white font-black py-4 rounded-2xl active:scale-95 transition-all shadow-lg">關閉</button>
            </div>
           </div>
         )}
        </main>
      </div>
     );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
